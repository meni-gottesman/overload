/* ========================= STORAGE (IndexedDB) =====================
   set_log is append-only and is the system of record. Every derived
   value is recomputed from it by rebuild(); nothing derived is trusted
   across a reload. This is what makes a schema change unable to corrupt
   history, and what makes the planner auditable after the fact.
   ================================================================== */
const DB_NAME="overload", DB_VER=1;
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains("events")) d.createObjectStore("events",{keyPath:"id",autoIncrement:true});
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos",{keyPath:"id"});
    };
    r.onsuccess=()=>{_db=r.result;res(_db)};
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return idb().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    let out; try{ out=fn(s); }catch(e){ rej(e); return; }
    /* An IDBRequest for a MISSING key completes with result === undefined.
       The old test `out.result !== undefined` therefore fell through and
       returned the IDBRequest itself — a truthy object. That made
       `kvGet("gh_pending") || []` yield an object instead of an array, so the
       first `Sync.pending.find(...)` after connecting threw "not a function"
       and backup could never start. Check for the PROPERTY, not its value. */
    t.oncomplete=()=>res(out && typeof out==="object" && ("result" in out) ? out.result : out);
    t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  }));
}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvPut=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const allEvents=()=>tx("events","readonly",s=>s.getAll());
async function append(type,payload){
  /* Ids are assigned explicitly rather than by the store's key generator.
     After an import restores events carrying their original ids, a generator
     that restarted at 1 would hand new events ids that already exist and
     overwrite restored history. voidSet payloads reference ids, so they cannot
     simply be renumbered — the ids have to stay stable and unique. */
  const nextId = S.events.reduce((m,e)=>Math.max(m, e.id||0), 0) + 1;
  const ev={id:nextId, type, payload, ts:Date.now(), d:todayISO()};
  await tx("events","readwrite",s=>s.put(ev));
  S.events.push(ev); Sync.queue(ev); return ev;
}

/* ---- eviction canary: an empty store must never read as a fresh start ---- */
async function canaryCheck(){
  const c=await kvGet("canary");
  const evs=await allEvents();
  if(c && evs.length===0 && c.count>0) return {evicted:true,had:c.count};
  return {evicted:false};
}
const canaryWrite=n=>kvPut("canary",{count:n,at:Date.now()});

/* ========================== DATE HELPERS =========================== */
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso,n){ const [y,m,d]=iso.split("-").map(Number); const t=new Date(y,m-1,d+n); return isoOf(t); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5); }
function isoWeek(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const dn=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-dn+3);
  const f=new Date(Date.UTC(dt.getUTCFullYear(),0,4)); const fn=(f.getUTCDay()+6)%7;
  f.setUTCDate(f.getUTCDate()-fn+3);
  return dt.getUTCFullYear()+"-W"+String(1+Math.round((dt-f)/6048e5)).padStart(2,"0"); }
function dow(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).getDay(); }

/* ============================ STATE ================================ */
const S = { events:[], settings:null, ex:{}, mus:{}, irr:{}, sessions:[], bw:[], photos:[],
            waist:[], notes:[], diffs:[], plans:{}, planEdits:{}, voided:new Set(),
            redflag:false, calibLast:null, restricted:false,
            phaseSince:null };

/* ===================== SINGLE-USER CONFIGURATION ==================
   This app has exactly one user and I already know his answers, so there is
   no wizard. Asking a question whose answer is already known is the same
   friction the whole logging surface exists to remove.

   Everything below is editable in Setup; nothing here is a lock. The training
   choices are not arbitrary defaults:
     - 4 days: frequency effects on hypertrophy are negligible once volume is
       equated (Pelland 2026, ACSM 2026), so nothing argues for a fifth.
     - weights: the evidence-derived tier vector, not a pairwise elicitation.
       Twelve taps cannot out-resolve a literature whose own between-muscle
       range is smaller than its rater disagreement.
     - CUT: his current phase. PHA-02 argues on the Today screen that it
       should end; that stays his call.
   ================================================================= */
function defaultSettings(){
  return { onboarded:true, unit:"lb", gym:JSON.parse(JSON.stringify(RSF_DEFAULT_GYM)),
    days:[1,2,4,5], minutes:120, slotHour:17, phase:"CUT",
    screening:"CLEAR", rampUntil:null, startDate:null,
    w:{...W_MALE}, tier:defaultTiers(), indexLift:defaultIndexLifts(), sex:"male",
    bodyKg:toKg(180,"lb"), heightCm:177.8, firstRun:true,
    allowOverrule:true, spotterAt:0, unlockHighVolume:false, repo:null, tokenSet:false };
}
function defaultTiers(){
  const t={};
  for(const m of MUSCLES) t[m] = NO_DIRECT.has(m) ? "MAINTAIN"
    : W_MALE[m]>=TIER_A ? "PRIORITY" : W_MALE[m]<=TIER_C ? "MAINTAIN" : "STANDARD";
  return t;
}
function defaultIndexLifts(){
  const ix={};
  for(const m of MUSCLES){ const e=LIB.find(x=>x.index===m); if(e) ix[m]=e.id; }
  return ix;
}
function newExState(e){
  return { load:null, lo:e.band[0], hi:e.band[1], hiEff:e.band[1], target:e.band[0],
    sessions:0, last:null, rirBias:K.RIR_BIAS_INIT, rirBiasN:0,
    consecShort:0, consecOver:0, sigma:1.2, seeded:false };
}
function newMuscleState(){
  return { target:K.FS_START, tier:"STANDARD", ladder:"RAMP", weeksAt:0, weeksFlat:0,
    pd:[], probeBase:null, probeLeft:0, deloadLeft:0, lastHard:null, doneWeek:0, fsWeek:0, failWeek:0 };
}

/* ---- the only place a plan change may be recorded ---- */
function emit(list, field, oldV, newV, triggerVar, triggerVal, ruleId, sentence){
  if(!ruleId) throw new Error("ENG-03: a change with no rule id is a build failure: "+field);
  if(!sentence) throw new Error("ENG-03: a change with no emittable sentence is a build failure: "+field);
  list.push({field,old:oldV,new:newV,triggerVar,triggerValue:triggerVal,rule:ruleId,sentence,at:Date.now()});
}

function rebuild(){
  S.settings = defaultSettings(); S.ex={}; S.mus={}; S.irr={}; S.sessions=[]; S.bw=[];
  S.photos=[]; S.waist=[]; S.notes=[]; S.diffs=[]; S.plans={}; S.planEdits={}; S.redflag=false; S.calibLast=null; S.phaseSince=null;
  for(const m of MUSCLES) S.mus[m]=newMuscleState();
  for(const j of JOINTS) S.irr[j]={sev:0,at:null,quality:null};

  const byDate = {};
  const voided = new Set();
  for(const ev of S.events) if(ev.type==="voidSet") voided.add(ev.payload.id);
  S.voided = voided;   // the VIEW must filter identically to the ledger, or a
                       // correction shows up as an extra set on the screen
  for(const ev of S.events){
    const p=ev.payload;
    if(ev.type==="set" && voided.has(ev.id)) continue;   // corrected, not deleted
    if(ev.type==="settings"){
      if(p.phase && p.phase!==S.settings.phase) S.phaseSince = ev.d;
      Object.assign(S.settings, p);
    }
    else if(ev.type==="waist") S.waist.push({d:p.d, cm:p.cm, site:p.site});
    else if(ev.type==="note") S.notes.push({d:p.d, text:p.text, ts:ev.ts});
    else if(ev.type==="redflag") S.redflag = !!p.active;
    else if(ev.type==="weight") S.bw.push({d:p.d,kg:p.kg});
    else if(ev.type==="photo") S.photos.push(p);
    else if(ev.type==="irritation"){ S.irr[p.joint]={sev:p.sev,at:p.d,quality:p.quality||null}; }
    else if(ev.type==="set"){ p._id=ev.id; (byDate[p.d]=byDate[p.d]||[]).push(p); }
    else if(ev.type==="planEdit"){ (S.planEdits[p.d]=S.planEdits[p.d]||[]).push(p); }
    else if(ev.type==="planStart"){
      /* ENG-02: a started plan is never re-planned. That means the payload has
         to be PERSISTED, not recomputed — logging sets changes weekly volume
         credit, which can change slot selection, so a rebuild mid-session
         would hand back a different session than the one being performed.
         loadSet is stripped on write (it is large and derivable) and
         rehydrated on read. */
      const plan = Object.assign({}, p.plan||{}, {status:"started"});
      if(Array.isArray(plan.slots)) plan.slots = plan.slots.map(sl=>{
        const e=LIBX[sl.ex];
        return Object.assign({}, sl, {loadSet: e ? loadableSet(e, S.settings.gym) : [0]});
      });
      S.plans[p.d] = plan;
    }
  }
  // Tiers live in settings but the planner reads S.mus[*].tier, and nothing
  // ever copied them across — so PRIORITY and MAINTAIN were dead code and
  // every muscle behaved as STANDARD.
  for(const m of MUSCLES){
    const t = S.settings.tier && S.settings.tier[m];
    S.mus[m].tier = (t==="PRIORITY"||t==="MAINTAIN"||t==="STANDARD") ? t : "STANDARD";
  }
  // Ramp-in starts at ~60% of each muscle's budget share and climbs to it,
  // rather than from a flat number that may already exceed the share.
  for(const m of MUSCLES){
    S.mus[m].target = NO_DIRECT.has(m) ? 0 : Math.max(1, Math.round(baseTarget(m)*0.6*2)/2);
  }
  // joint irritation decays 1 point per elapsed calendar day, floor 0
  for(const j of JOINTS){ const r=S.irr[j];
    if(r.at){ const el=daysBetween(r.at, todayISO()); r.sev=Math.max(0, r.sev-Math.max(0,el)); } }

  const dates = Object.keys(byDate).sort();
  let lastWeek = null;
  for(const d of dates){
    const wk = isoWeek(d);
    if(lastWeek && wk!==lastWeek) weeklyRollover(lastWeek);
    lastWeek = wk;
    const sess = {date:d, week:wk, sets:byDate[d]};
    S.sessions.push(sess);
    creditVolume(sess);
    // Phase 1 ingests COMPLETED sessions only. Ingesting the in-progress day
    // would move working loads underneath the user mid-workout, and would make
    // the plan they are standing in front of disagree with the one they started.
    if(d < todayISO()) ingestSession(sess);
  }
  if(lastWeek && lastWeek!==isoWeek(todayISO())) weeklyRollover(lastWeek);
  computeRestricted();
}

function exState(id){
  if(!S.ex[id]) S.ex[id]=newExState(LIBX[id]);
  return S.ex[id];
}

/* Prior hard sets on the same muscle, earlier in THIS session. Warm-ups are
   not hard sets; voided sets are already gone from sess.sets by the time
   rebuild() gets here. Returned as a side Map because sess.sets holds the live
   event payload objects — assigning to them would mutate the log itself. */
function priorHardMap(sess){
  const out=new Map(), seen=[];
  for(const st of sess.sets){
    if(st.warmup) continue;
    const e=LIBX[st.ex]; if(!e) continue;
    let prior=0;
    for(const pst of seen){
      const pe=LIBX[pst.ex]; if(!pe) continue;
      for(const m of Object.keys(e.contributions)) if(pe.contributions[m]){ prior += pe.contributions[m]; break; }
    }
    out.set(st, r1(prior)); seen.push(st);
  }
  return out;
}

/* ---------- volume ledger (VOL-01) ---------- */
function creditVolume(sess){
  const seen = {};
  for(const st of sess.sets){
    if(st.warmup) continue;
    const e=LIBX[st.ex]; if(!e) continue;
    const es=exState(st.ex);
    const qualifies = es.load ? (st.load >= K.QUALIFY_LOAD_FRAC*es.load && st.reps >= es.lo) : true;
    if(!qualifies) continue;
    for(const [m,frac] of Object.entries(e.contributions)){
      if(!S.mus[m]) continue;
      S.mus[m].fsWeek += frac;
      seen[m]=(seen[m]||0)+frac;
      if(st.endpoint==="FAILED_CONCENTRIC") S.mus[m].failWeek += frac;
    }
  }
  /* A row paying 0.5 to biceps is not a biceps session. Counting it as one
     marked the muscle done for the week and started its 48-hour clock, so it
     never got direct work again. A session counts for a muscle only once it
     has received a whole fractional set of credit. */
  for(const m of Object.keys(seen)) if(seen[m] >= 1.0){
    S.mus[m].doneWeek += 1; S.mus[m].lastHard = sess.date;
  }
}

/* ============ PHASE 1 — ingest yesterday (PRG-00 .. PRG-10) ========
   The expectation is recomputed with the ACTUAL exercise position and
   ACTUAL recovery hours, not the planned ones. Without this, exercise #4
   is judged as if you were fresh, the fatigued set reads as a genuine
   shortfall, and the planner cuts its load session after session.
   =================================================================== */
function ingestSession(sess){
  const byEx = {};
  for(const st of sess.sets){ if(!st.warmup) (byEx[st.ex]=byEx[st.ex]||[]).push(st); }
  const diffs=[];
  for(const [exId, sets] of Object.entries(byEx)){
    const e=LIBX[exId]; if(!e) continue;
    const es=exState(exId);
    const set = loadableSet(e, S.settings.gym);
    if(es.load==null && sets.length){
      /* Cold start: session 1 of every exercise IS the measurement.
         "Pick a weight you could get about 15 times, do 8" -> working load
         = reported x 1.12 (Nuzzo 2024 splines; the large between-exercise
         gap washes out of this particular ratio, so one constant covers
         everything and the app never ships a %1RM table). No max testing. */
      es.load = snapLoad(e, sets[0].load * (es.seeded?1:K.SEED_MULT)); es.seeded=true;
    }
    es.load = nearestLoad(set, es.load);   // invariant: always a real weight
    const W = sets.filter(s=>s.rom!==0 && !(s.assisted>0) && s.reps<=K.RIR_IGNORE_REPS);
    es.sessions += 1; es.last = sess.date;
    if(!W.length) continue;

    // --- PRG-00 fatigue-aware expectation --------------------------
    /* priorHard is RECOMPUTED here rather than trusted from the event. The
       value recorded at log time counted warm-ups and corrected-away sets as
       hard work, which shrank the expectation, which inflated delta past the
       deadband — so merely hitting your prescription after two warm-ups read
       as "you beat the target" and the load went up. Recomputing from the
       replayed session fixes days already on disk too, because rebuild() has
       already dropped voided sets and warm-ups are skipped below. */
    const priorOf = priorHardMap(sess);
    let sumAch=0, sumExp=0, anyOver=false;
    for(const st of W){
      const pr = priorOf.has(st) ? priorOf.get(st) : 0;
      const exp = (st.pReps||es.target)
                - K.KAPPA*pr
                - K.PSI*Math.exp(-(st.hoursSince==null?72:st.hoursSince)/24);
      sumAch += st.reps; sumExp += exp;
      if(st.reps > (st.pReps||es.target)) anyOver = true;
    }
    let delta = (sumAch - sumExp)/W.length;
    /* You cannot beat a target you were capped at. If nobody exceeded the
       prescription, the fatigue discount alone must never manufacture a
       surplus — otherwise doing exactly what you were told reads as a win and
       the load ratchets until you start missing. */
    if(!anyOver && delta > 0) delta = 0;
    const coldstart = es.sessions <= K.COLDSTART_SESSIONS;

    if(delta > -K.DEADBAND && delta < K.DEADBAND){          // PRG-01
      es.consecShort=0; es.consecOver=0;
      doubleProgression(e, es, set, diffs, W);
    } else if(delta >= K.DEADBAND){                          // PRG-02
      /* The up-correction is subject to the SAME increment reality as the
         double-progression path. Without this, a coarse cable stack turns a
         "+2%" decision into a 33% jump, which is precisely the failure PRG-06
         exists to prevent. If the rack cannot make a step inside the cap, add
         a rep instead — and if reps have run past the band ceiling twice, the
         jump is forced anyway (PRG-07). */
      const overshoot = W.every(s=>s.reps > es.hiEff);
      es.consecOver = overshoot ? es.consecOver+1 : 0;
      const forced = es.consecOver >= K.FORCE_JUMP_EXPOSURES;
      let pct = K.UP_STEPS.find(([lim])=>delta<lim)[1];
      if(coldstart) pct = Math.min(K.COLDSTART_CAP_REL, Math.max(pct, 0.06));
      const nl = applyLoadStep(set, es.load, pct, e);
      const capRel = coldstart ? K.COLDSTART_CAP_REL : K.CAP_REL[e.cls];
      const capAbs = e.cls==="lb_compound" ? K.CAP_ABS_LOWER : K.CAP_ABS_UPPER;
      const ceiling = e.band[1] + Math.floor(0.5*(e.band[1]-e.band[0]));
      const jump = nl==null ? Infinity : Math.abs(nl-es.load);
      const withinCap = nl!=null && jump/es.load <= capRel && jump <= capAbs;
      if(nl && (withinCap || forced || es.hiEff>=ceiling)){
        const o=es.load; es.load=nl; es.target=es.lo; es.hiEff=e.band[1]; es.consecOver=0;
        emit(diffs,"load",o,nl,"delta",r1(delta),forced?"PRG-07":"PRG-02",
          forced ? `You've been past the top of the band twice — forcing the jump to ${fmtLoad(nl)}. Reps reset to ${es.lo}.`
                 : `You beat the target by ${r1(delta)} reps a set — load up to ${fmtLoad(nl)}, back to ${es.lo} reps.`);
      } else if(es.hiEff < ceiling){
        const o=es.hiEff; es.hiEff += 1; es.target = Math.min(es.hiEff, es.target+1);
        emit(diffs,"hiEff",o,es.hiEff,"delta",r1(delta),"PRG-06",
          nl ? `You beat the target, but the next step is a ${pct1(Math.abs(nl-es.load)/es.load)} jump — too big. Adding a rep instead.`
             : `You beat the target but there is nothing heavier here — adding a rep instead.`);
      }
      es.consecShort=0;
    } else {                                                 // PRG-03 asymmetric
      es.consecShort += 1;
      if(es.consecShort===1 && delta > -2){
        emit(diffs,"load",es.load,es.load,"delta",r1(delta),"PRG-03",
          `Held the load — one short session is inside the noise.`);
      } else {
        let pct = K.DOWN_STEPS.find(([lim])=>delta>lim)[1];
        if(coldstart) pct = Math.max(-K.COLDSTART_CAP_REL, pct);
        const nl = applyLoadStep(set, es.load, pct, e);
        if(nl){ const o=es.load; es.load=nl; es.target=es.lo; es.consecShort=0;
          emit(diffs,"load",o,nl,"delta",r1(delta),"PRG-03",
            `Missed the target by ${r1(-delta)} reps a set twice — down to ${fmtLoad(nl)}.`);
        }
      }
    }

    // --- PRG-09 calibration ingest -------------------------------
    for(const st of W){
      if(st.calibration && st.endpoint==="FAILED_CONCENTRIC" && st.extraReps!=null && st.rir!=null){
        const o=es.rirBias;
        es.rirBias = clamp(es.rirBias + K.RIR_BIAS_LR*(st.extraReps - st.rir), 0, 3);
        es.rirBiasN += 1;
        emit(diffs,"rirBias",r1(o),r1(es.rirBias),"extraReps",st.extraReps,"PRG-09",
          `Calibration: you had ${st.extraReps} more reps when you called it ${st.rir}. Adjusting how I read your RIR.`);
        S.calibLast = sess.date;
      }
    }
  }
  S.diffs.push({date:sess.date, list:diffs});
}

function doubleProgression(e, es, set, diffs, W){        // PRG-04..PRG-08
  const allHit = W.every(s=>s.reps >= (s.pReps||es.target));
  const overshoot = W.every(s=>s.reps > es.hiEff);
  if(overshoot) es.consecOver += 1; else es.consecOver = 0;
  const forced = es.consecOver >= K.FORCE_JUMP_EXPOSURES;   // PRG-07 invariant
  if(!allHit && !forced) return;

  if(es.target < es.hiEff && !forced){
    const o=es.target; es.target += 1;
    emit(diffs,"target",o,es.target,"allSetsHit",true,"PRG-04",
      `Hit ${o} on every set — going for ${es.target} next time.`);
    return;
  }
  const nxt = harderLoad(e, set, es.load);
  const relInc = nxt ? Math.abs(nxt-es.load)/es.load : Infinity;
  const capRel = K.CAP_REL[e.cls], capAbs = e.cls==="lb_compound"?K.CAP_ABS_LOWER:K.CAP_ABS_UPPER;
  const ceiling = e.band[1] + Math.floor(0.5*(e.band[1]-e.band[0]));   // PRG-06

  if(nxt && (relInc<=capRel && Math.abs(nxt-es.load)<=capAbs || forced)){
    const o=es.load; es.load=nxt; es.target=es.lo; es.hiEff=e.band[1]; es.consecOver=0;
    emit(diffs,"load",o,nxt,forced?"consecOver":"toppedBand",forced?es.consecOver:true,
      forced?"PRG-07":"PRG-05",
      forced ? `You've been over the top of the band twice — forcing the jump to ${fmtLoad(nxt)}. Reps reset to ${es.lo}.`
             : `Topped the band — ${fmtLoad(o)} → ${fmtLoad(nxt)}, back to ${es.lo} reps.`);
    return;
  }
  /* THE INCREMENT-STALL RULE (PRG-06). Your gym cannot make the jump the
     math wants. Do not fake a fractional carry, do not drift reps forever,
     do not stall. Widen the band by up to half its width, then force.
     Licence: ACSM 2026 — "Muscle hypertrophy was not affected by load." */
  if(es.hiEff < ceiling){
    const o=es.hiEff; es.hiEff += 1; es.target += 1;
    emit(diffs,"hiEff",o,es.hiEff,"relInc",nxt?pct1(relInc):"none","PRG-06",
      nxt ? `The next weight up is a ${pct1(relInc)} jump — too big. Adding a rep instead.`
          : `Nothing heavier exists here. Adding a rep instead.`);
  } else if(nxt){
    const o=es.load; es.load=nxt; es.target=es.lo; es.hiEff=e.band[1];
    emit(diffs,"load",o,nxt,"bandCeiling",ceiling,"PRG-06",
      `Big jump: ${fmtLoad(o)} → ${fmtLoad(nxt)}, reps reset to ${es.lo}. Expect two hard sessions.`);
  }
}

/* ============ PHASE 2 — weekly rollover (VOL-*) =================== */
function indexScore(m, week){
  const exId = S.settings.indexLift[m]; if(!exId) return null;
  const es = S.ex[exId]; const ref = es && es.load ? es.load : null; if(!ref) return null;
  let sum=0,n=0;
  for(const s of S.sessions){ if(s.week!==week) continue;
    for(const st of s.sets){ if(st.ex!==exId||st.warmup) continue;
      sum += st.reps + 40*Math.log(st.load/ref); n++; } }
  return n ? sum/n : null;
}
function weeklyRollover(week){
  const prevWeek = prevWeekOf(week);
  for(const m of MUSCLES){
    const ms=S.mus[m], diffs=[];
    const base = baseTarget(m);
    if(NO_DIRECT.has(m)){
      // SEL-04: no direct sets. Rows, carries, deadlifts and pressing already
      // pay these fractionally; the floor check below is what watches them.
      ms.target = 0; ms.ladder = "MAINTAIN";
    } else if(ms.ladder==="RAMP"){
      const o=ms.target; ms.target = Math.min(base, ms.target + K.FS_RAMP_STEP);
      if(ms.target>=base){ ms.ladder="BUILD"; }
      if(o!==ms.target) emit(diffs,"target",o,ms.target,"ramp",true,"SAF-RAMP",
        `Ramping ${MUSCLE_LABEL[m].toLowerCase()}: ${r1(o)} → ${r1(ms.target)} sets a week.`);
    } else {
      // The ladder may move you around your budget share, never away from it.
      const clamped = clamp(ms.target, Math.max(0, base-3), base+3);
      if(Math.abs(clamped-ms.target) > 0.01){
        const o=ms.target; ms.target=clamped;
        emit(diffs,"target",r1(o),r1(ms.target),"budget",base,"VOL-13",
          `${MUSCLE_LABEL[m]} re-anchored to ${r1(base)} sets — that's its share of a ${K.BUDGET[S.settings.phase]||K.BUDGET.MAINTAIN}-set week ${S.settings.phase==="CUT"?"in a deficit":""}.`.replace(/ +/g," "));
      }
    }
    // VOL-14: floor on TOTAL weekly credit, direct plus indirect. This is what
    // keeps a Tier-D group from disappearing entirely.
    if(ms.fsWeek>0 && ms.fsWeek < K.MIN_SETS && !NO_DIRECT.has(m) && ms.ladder!=="DELOAD"){
      const o=ms.target; ms.target=Math.max(ms.target, K.MIN_SETS);
      if(o!==ms.target) emit(diffs,"target",r1(o),r1(ms.target),"floor",K.MIN_SETS,"VOL-14",
        `${MUSCLE_LABEL[m]} came in under the ${K.MIN_SETS}-set floor — raising it. Structural balance, not appearance.`);
    }
    /* A week with no index-lift data produced no new z, and the previous
       week's value was pushed again — so one bad week could be counted three
       times and fake a "down three weeks running" deload. Only a FRESH score
       enters the window. */
    ms.z = null;
    const a=indexScore(m,week), b=indexScore(m,prevWeek);
    if(a!=null && b!=null){
      const pd=a-b; ms.pd.push(pd); if(ms.pd.length>8) ms.pd.shift();
      const sigma = Math.max(K.SIGMA_FLOOR, sd(ms.pd));
      ms.z = pd/sigma;
    }
    ms.zHist = ms.zHist||[];
    if(ms.z!=null){ ms.zHist.push(ms.z); if(ms.zHist.length>3) ms.zHist.shift(); }
    const roll3 = ms.zHist.reduce((x,y)=>x+y,0);
    const deloadTrig = S.settings.phase==="CUT" ? K.ROLL3_DELOAD*K.CUT_DELOAD_MULT : K.ROLL3_DELOAD;
    const irrMax = Math.max(0, ...Object.values(S.irr).map(r=>(r&&r.sev)||0));

    if(ms.deloadLeft>0){ ms.deloadLeft -= 7; if(ms.deloadLeft<=0){ ms.ladder="HOLD";
        emit(diffs,"ladder","DELOAD","HOLD","deloadDone",true,"VOL-10",`${MUSCLE_LABEL[m]} deload finished — back to normal sets.`);} }
    else if(roll3 <= deloadTrig || countIrritated(5)>=2){                 // VOL-05
      ms.ladder="DELOAD"; ms.deloadLeft=K.DELOAD_DAYS;
      emit(diffs,"ladder","*","DELOAD","roll3",r1(roll3),"VOL-05",
        `${MUSCLE_LABEL[m]} performance is down three weeks running — halving sets for a week. Load stays where it is.`);
    }
    else if(ms.fsWeek < K.SHORTFALL_HOLD*ms.target){                      // VOL-07
      emit(diffs,"target",ms.target,ms.target,"completed",r1(ms.fsWeek),"VOL-07",
        `Logged ${r1(ms.fsWeek)} of ${r1(ms.target)} sets for ${MUSCLE_LABEL[m].toLowerCase()} — holding, not adding. You cannot bank volume you did not do.`);
    }
    else if(S.settings.phase==="CUT"){                                     // VOL-08
      if(ms.ladder!=="MAINTAIN"){ ms.ladder="MAINTAIN";
        emit(diffs,"ladder","*","MAINTAIN","phase","CUT","VOL-08",
          `You're cutting — holding ${MUSCLE_LABEL[m].toLowerCase()} at ${r1(ms.target)} sets rather than chasing more.`); }
    }
    else if(roll3 >= K.ROLL3_UP && ms.weeksAt>=2 && irrMax<4){             // VOL-06
      if(ms.target+K.FS_UP > K.FS_SOFT_CEIL && !S.settings.unlockHighVolume){
        emit(diffs,"target",ms.target,ms.target,"softCeiling",K.FS_SOFT_CEIL,"VOL-06",
          `${MUSCLE_LABEL[m]} is at ${r1(ms.target)} sets. Above 20 the evidence stops agreeing with itself — unlock it in Setup if you want to go higher.`);
      } else {
        const o=ms.target; ms.target+=K.FS_UP; ms.weeksAt=0; ms.weeksFlat=0;
        emit(diffs,"target",o,ms.target,"roll3",r1(roll3),"VOL-06",
          `${MUSCLE_LABEL[m]} is moving — ${r1(o)} → ${r1(ms.target)} sets a week.`);
      }
    }
    else if(Math.abs(roll3) < K.ROLL3_UP){
      ms.weeksFlat += 1;
      /* THE DESCENT PROBE (VOL-09). Volume must be able to come DOWN on
         flatness, not only on a complaint — otherwise a stoic user who
         grinds and reports nothing ratchets to the ceiling and sits there
         with no way to tell thriving from digging a hole.
         Arithmetic licence: g(20)-g(16) = 0.79% against a ~2% detection
         floor. Volume above ~16 sets is nearly free to give back. */
      if(ms.weeksFlat>=K.FLAT_WEEKS_PROBE && ms.ladder==="HOLD" && ms.target>K.PROBE_MIN_TARGET){
        ms.probeBase=ms.target; const o=ms.target;
        ms.target-=K.PROBE_DROP; ms.ladder="PROBE"; ms.probeLeft=K.PROBE_WEEKS;
        emit(diffs,"target",o,ms.target,"weeksFlat",ms.weeksFlat,"VOL-09",
          `${MUSCLE_LABEL[m]} has been flat 8 weeks — trying ${r1(K.PROBE_DROP)} fewer sets for a month to see if the extra work was doing anything.`);
      }
    }
    if(ms.ladder==="PROBE"){
      ms.probeLeft-=1;
      if(ms.probeLeft<=0){
        if(roll3>=-K.ROLL3_UP){ ms.ladder="HOLD";
          emit(diffs,"target",ms.probeBase,ms.target,"probe","kept","VOL-09",
            `${MUSCLE_LABEL[m]} held up on fewer sets — keeping the lower volume and the time back.`);
        } else { const o=ms.target; ms.target=ms.probeBase; ms.ladder="HOLD";
          emit(diffs,"target",o,ms.target,"probe","reverted","VOL-09",
            `${MUSCLE_LABEL[m]} dropped off on fewer sets — putting them back.`); }
        ms.weeksFlat=0;
      }
    }
    ms.weeksAt += 1; ms.fsWeek=0; ms.doneWeek=0; ms.failWeek=0;
    if(diffs.length) S.diffs.push({date:week, list:diffs, weekly:true});
  }
}
/* ===== VOL-13/14/15 — the weekly set budget is the authority ==========
   Per-muscle targets are DERIVED from a phase-dependent total budget and the
   weight vector, not laddered independently. The ladder still moves a muscle
   around its share, but it can no longer quietly inflate the whole week: the
   budget is what a 4-day schedule can actually recover from, and in a deficit
   it is smaller because added volume there does not buy hypertrophy, it buys
   fatigue (Murphy & Koehler 2022, lean-mass ES = -0.57 vs control). */
function weightsOf(){ return (S.settings && S.settings.w) || W_MALE; }
function directWeightSum(){ const w=weightsOf();
  return MUSCLES.filter(m=>!NO_DIRECT.has(m)).reduce((a,m)=>a+(w[m]||0),0); }
function baseTarget(m){
  if(NO_DIRECT.has(m)) return 0;                                   // SEL-04
  const B = K.BUDGET[S.settings.phase] || K.BUDGET.MAINTAIN;
  const w = weightsOf(), den = directWeightSum() || 1;
  return Math.round((B*(w[m]||0)/den)*2)/2;                        // to the nearest half set
}
/* VOL-15: the evidence resolves four tiers, so refuse any edit steeper than
   4:1 or carrying more than four distinct values. A finer vector is a claim
   this literature cannot support. */
function weightsLegal(w){
  const vals = MUSCLES.map(m=>w[m]||0).filter(v=>v>0);
  if(!vals.length) return false;
  const hi=Math.max(...vals), lo=Math.min(...vals);
  return (hi/lo) <= K.MAX_TIER_RATIO + 1e-9 && new Set(vals).size <= 4;
}
function prevWeekOf(w){ const [y,n]=w.split("-W").map(Number);
  return n>1 ? y+"-W"+String(n-1).padStart(2,"0") : (y-1)+"-W52"; }
function countIrritated(th){ return JOINTS.filter(j=>(S.irr[j]||{sev:0}).sev>=th).length; }
function sd(a){ if(a.length<2) return 0; const m=a.reduce((x,y)=>x+y,0)/a.length;
  return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1)); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const listOf=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
const r1=v=>Math.round(v*10)/10;
const pct1=v=>Math.round(v*1000)/10+"%";

/* ===================== DISPLAY / UNIT HELPERS ====================== */
function u(){ return S.settings ? S.settings.unit : "lb"; }
function fmtLoad(kg){ if(kg==null) return "—";
  const v=fromKg(kg,u()); const r=Math.abs(v-Math.round(v))<0.05?Math.round(v):Math.round(v*10)/10;
  return r+" "+u(); }
function fmtL(e,kg){ if(kg==null) return "—";
  return (e.profile==="dumbbell_pair" && e.perSide ? "2 × " : "") + fmtLoad(kg); }

/* ===================== PLATE MATH ==================================
   Nobody should be doing arithmetic between sets. Greedy from the heaviest
   pair down, bounded by how many pairs the gym actually owns — if the target
   is not makeable from real plates it returns null rather than a lie, which
   should never happen because every prescribed load is a member of the
   loadable set by construction. */
function plateMath(e, kg){
  if(e.profile!=="barbell" || kg==null) return null;
  const g=S.settings.gym;
  let side=(kg-g.barKg)/2;
  if(side < -0.01) return null;
  if(side < 0.01) return "empty bar";
  const plates=g.plates.map(p=>({w:toKg(p.w,g.unit), n:p.pairs, label:p.w})).sort((a,b)=>b.w-a.w);
  const out=[];
  for(const p of plates){
    let c=0;
    while(side >= p.w - 1e-6 && c < p.n){ side -= p.w; c++; }
    if(c) out.push(c+"×"+p.label);
  }
  return side > 0.02 ? null : out.join(" + ") + " a side";
}

/* ===================== REST TIMER =================================
   Rest is a constant, never autoregulated (FAI-02, Singer 2024: no detectable
   hypertrophy difference beyond 90 s). So this counts, it does not decide. */
const Rest = {
  until:0, ex:null, tick:null,
  start(exId, seconds){
    this.until = Date.now() + seconds*1000; this.ex = exId;
    if(!this.tick) this.tick = setInterval(()=>Rest.paint(), 1000);
    this.paint();
  },
  left(){ return Math.max(0, Math.ceil((this.until - Date.now())/1000)); },
  paint(){
    const el = document.getElementById("resttimer");
    const n = this.left();
    if(!el){ if(!n && this.tick){ clearInterval(this.tick); this.tick=null; } return; }
    if(n<=0){ el.textContent = "Rest done"; el.className = "pill ok";
      if(this.tick){ clearInterval(this.tick); this.tick=null;
        if(navigator.vibrate) try{ navigator.vibrate([120,80,120]); }catch(e){} }
      return; }
    el.textContent = `Rest ${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
    el.className = "pill";
  },
  clear(){ this.until=0; this.ex=null; if(this.tick){ clearInterval(this.tick); this.tick=null; } }
};

/* ======================= BODYWEIGHT TREND (PHA-*) ==================
   EWMA alpha 0.10, then OLS slope over a window forced to an exact
   multiple of 7 days so a weekly weighing rhythm cannot alias into the
   trend. No calorie or volume change may fire below 8 readings in 14 d.
   =================================================================== */
function bwTrend(){
  if(!S.bw.length) return null;
  const rows=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);
  let ew=null; const series=[];
  for(const r of rows){ ew = ew==null ? r.kg : (K.BW_ALPHA*r.kg + (1-K.BW_ALPHA)*ew);
    series.push({d:r.d, kg:r.kg, ew}); }
  const today=todayISO();
  const win = series.filter(s=>daysBetween(s.d,today) < K.BW_WINDOW_D);
  const recent14 = series.filter(s=>daysBetween(s.d,today) < 14).length;
  let slope=null;
  if(win.length>=3){
    const x=win.map(s=>-daysBetween(s.d,today)), y=win.map(s=>s.ew);
    const mx=x.reduce((a,b)=>a+b,0)/x.length, my=y.reduce((a,b)=>a+b,0)/y.length;
    let num=0,den=0; for(let i=0;i<x.length;i++){num+=(x[i]-mx)*(y[i]-my);den+=(x[i]-mx)**2;}
    slope = den? num/den : null;   // kg per day
  }
  const cur = series[series.length-1];
  const pctWk = (slope!=null && cur.ew) ? (slope*7)/cur.ew : null;
  return { ew:cur.ew, last:cur.kg, lastDate:cur.d, slopeKgWk:slope!=null?slope*7:null,
           pctWk, readings14:recent14, enough:recent14>=K.BW_MIN_READINGS, n:series.length };
}

/* ======================= PHASE MACHINE (PHA-*) =====================
   Nothing here keys on an estimated body-fat percentage. Consumer BIA and
   calipers carry +/-3-5 percentage points, which is wider than any band worth
   defending — "15%" could be 11% or 19%. Everything triggers on waist and
   scale trend, measured the same way each time.
   =================================================================== */
function waistStats(){
  if(!S.waist.length) return null;
  const rows=[...S.waist].sort((a,b)=>a.d<b.d?-1:1), today=todayISO();
  const med = arr => { if(!arr.length) return null;
    const v=arr.map(x=>x.cm).sort((a,b)=>a-b); const h=v.length>>1;
    return v.length%2 ? v[h] : (v[h-1]+v[h])/2; };
  const win28 = rows.filter(r=>daysBetween(r.d,today)<28);
  const win90 = rows.filter(r=>daysBetween(r.d,today)<90);
  return { latest: rows[rows.length-1], median28: med(win28),
           min90: win90.length ? Math.min(...win90.map(r=>r.cm)) : null, n: rows.length };
}
function dismissed(rule){ return ((S.settings&&S.settings.dismissed)||[]).includes(rule); }
function weeksInPhase(){
  const since = S.phaseSince || (S.settings && S.settings.startDate);
  return since ? Math.floor(daysBetween(since, todayISO())/7) : 0;
}
/* Returns the coaching call, or null when the data cannot support one. */
function phaseAdvice(){
  const st=S.settings, t=bwTrend(), w=waistStats(), wk=weeksInPhase();
  const out=[];

  // PHA-08 the leanness-first branch. Fires on a measurable, and cuts CALORIES,
  // never volume. Threshold is calibrated to instrument noise (MDC95 ~1.7 cm
  // for a mean of three), not to any preference study. Labelled judgment.
  if(w && w.median28!=null && w.min90!=null && w.median28 > w.min90 + K.WAIST_TRIPWIRE_CM && st.phase!=="CUT"){
    out.push({rule:"PHA-08", kind:"warn",
      text:`Your 4-week waist median is ${r1(w.median28-w.min90)} cm above your 90-day low. That's past the ${K.WAIST_TRIPWIRE_CM} cm tripwire, so this is a food decision, not a training one — sets stay where they are.`});
  }
  // PHA-06 hard stop on a long deficit. Enforced, not suggested.
  if(st.phase==="CUT" && wk >= K.MAX_CUT_WEEKS){
    out.push({rule:"PHA-06", kind:"bad",
      text:`${wk} straight weeks in a deficit. Two weeks at maintenance now — this one isn't a suggestion.`});
  }
  // PHA-03 / PHA-07 rate clamps
  if(t && t.enough && t.pctWk!=null){
    const [lo,hi] = st.phase==="CUT" ? K.CUT_RATE : st.phase==="GAIN" ? K.GROW_RATE : [null,null];
    if(lo!=null){
      if(t.pctWk < lo) out.push({rule:st.phase==="CUT"?"PHA-03":"PHA-07", kind:"warn",
        text: st.phase==="CUT"
          ? `You're losing ${Math.abs(t.pctWk*100).toFixed(2)}% a week. Above 0.8% the lean mass starts going with it — Garthe measured +2.1% lean at 0.7%/wk against −0.2% at 1.4%. Eat a bit more.`
          : `Gaining slower than 0.20% a week. Add about 200 kcal.`});
      else if(t.pctWk > hi) out.push({rule:st.phase==="CUT"?"PHA-03":"PHA-07", kind:"warn",
        text: st.phase==="CUT"
          ? `You're losing ${Math.abs(t.pctWk*100).toFixed(2)}% a week — slower than the 0.5–0.8% band.`
          : `Gaining faster than 0.35% a week. That's mostly fat now; pull back about 200 kcal.`});
    }
  }
  // PHA-02 the standing call. Deliberately worded as a decision he makes, not
  // a number the app asserts, because his body-fat figure cannot be trusted to
  // +/-3-5 points and the whole recommendation turns on it.
  if(st.phase==="CUT" && wk<K.MAX_CUT_WEEKS && !dismissed("PHA-02")){
    out.push({rule:"PHA-02", kind:"info", dismissable:true,
      text:`You're already about as lean as the evidence says helps. Cutting further mostly costs you muscle.`,
      more:`When female raters adjusted male bodies to the most attractive version they stopped near 16% body fat, roughly where you are. A deficit measurably blunts muscle gain — lean-mass effect size −0.57 against eating at maintenance. If your waist is where you want it, the higher-return lever is maintenance and building. Switch phase in Settings.`});
  }
  return out;
}

/* ===================== RESTRICTED MODE (language rules) ============
   Behavioural tripwire, not a screening instrument. A high-sensitivity
   muscle-dysmorphia cutoff flags roughly half of male gym-goers against
   a single-digit true prevalence — as a gate that is a coin flip. So the
   trigger is behaviour: >=6 sessions/week for 3 consecutive weeks, or
   training a muscle whose joint flag is >=6/10.
   =================================================================== */
function computeRestricted(){
  const byWeek={};
  for(const s of S.sessions) byWeek[s.week]=(byWeek[s.week]||0)+1;
  const weeks=Object.keys(byWeek).sort().slice(-K.RESTRICTED_WEEKS);
  const heavy = weeks.length>=K.RESTRICTED_WEEKS && weeks.every(w=>byWeek[w]>=K.RESTRICTED_SESSIONS);
  const hurt = JOINTS.some(j=>(S.irr[j]||{sev:0}).sev>=6) && S.sessions.length &&
               daysBetween(S.sessions[S.sessions.length-1].date, todayISO())<=1;
  S.restricted = !!(heavy||hurt);
}

/* ============ PRG-10 — the calibration scheduler ==================
   The ONLY observation that separates "you got stronger" from "you sandbag
   your RIR". Without it those two are structurally confounded and rir_bias
   sits on its +1.0 prior forever. Pooled underprediction of reps-to-failure
   is 0.95 reps (95% CI 0.17-1.73), between-participant SD 1.45, and training
   status does NOT moderate it — so there is no "he's experienced, skip it".
   Placed only on a fail-safe isolation lift with clean joints, never in ramp. */
function calibrationTarget(slots, ctx, date){
  // A calibration set IS a failure set, so every rule that forbids failure
  // forbids this. Gate on allowFailure too, not just the ramp flag.
  if(ctx.ramping || !ctx.allowFailure || S.settings.screening!=="CLEAR") return null;
  const since = S.calibLast ? daysBetween(S.calibLast, date) : 999;
  if(since < K.CALIB_DAYS) return null;
  for(const sl of slots){
    const e=LIBX[sl.ex];
    if(!e || !e.failSafe || e.cls!=="isolation") continue;
    if(Object.keys(e.joints).some(j=>S.irr[j] && S.irr[j].sev>0)) continue;
    const ms=S.mus[sl.muscle];
    if(ms && ms.failWeek >= K.FAILURE_SHARE*ms.target) continue;
    return sl.ex;
  }
  return null;
}

/* ======================== THE NIGHTLY PLANNER ======================
   Pure function of (state, local_date). Called on rollover and again at
   session start; the session-start call is the authoritative one because
   every input that matters is freshest then.
   =================================================================== */
function ensurePlan(date){
  const stored = S.plans[date];
  // ENG-02 never re-plan a started session — but only honour a stored plan that
  // actually carries one. A statusless stub must fall through and rebuild.
  if(stored && stored.status==="started" && Array.isArray(stored.slots) && stored.slots.length)
    return applyPlanEdits(clonePlan(stored), date);
  const base = buildPlan(date);
  S.plans[date] = Object.assign({status:"unstarted"}, base);
  return applyPlanEdits(clonePlan(S.plans[date]), date);
}

function buildPlan(date){
  const st=S.settings, diffs=[], notes=[];

  /* --- Phase 0: gates ------------------------------------------- */
  if(S.redflag) return {blocked:true, reason:BLOCKED_STRING, rule:"SAF-RED", slots:[], diffs, notes};
  if(st.screening==="BLOCKED") return {blocked:true, reason:BLOCKED_STRING, rule:"SAF-SCREEN", slots:[], diffs, notes};

  const ctx = { minRir:1, allowFailure:true, maxSets:4, weeklyCap:null, loadCap:null };
  if(st.screening==="LIGHT_MODERATE_ONLY"){                       // SAF-01
    ctx.minRir=3; ctx.allowFailure=false; ctx.loadCap=0.70;
    notes.push({rule:"SAF-SCREEN", text:"Your screening answers put you in the conservative mode: nothing near failure, loads capped."});
  }
  // MIS-01 layoff bands + SAF-RAMP
  const lastSess = S.sessions.length ? S.sessions[S.sessions.length-1].date : null;
  const gap = lastSess ? daysBetween(lastSess, date) : null;
  let ramping = st.rampUntil && date < st.rampUntil;
  if(gap!=null && gap >= K.LAYOFF_SHORT){
    ramping = true;
    notes.push({rule:"MIS-01", text:`${gap} days off — starting you back at reduced sets and 3 reps in reserve for a bit. (This band is an engineering choice, not a trial result.)`});
  }
  ctx.ramping = !!ramping;          // read by calibrationTarget (PRG-10)
  if(ramping){                                                     // SAF-RAMP
    ctx.minRir=Math.max(ctx.minRir,K.RAMP_MIN_RIR); ctx.allowFailure=false;
    ctx.maxSets=K.RAMP_MAX_SETS; ctx.weeklyCap=K.RAMP_WEEKLY_CAP;
  }

  const isTrainingDay = st.days.includes(dow(date));
  if(!isTrainingDay && !S.plans[date]) notes.push({rule:"USER", text:"Not one of your training days."});

  /* --- Phase 3: which muscles today (SEL-01..03) ---------------- */
  const needed={}, deficit={}, eligible=[];
  for(const m of MUSCLES){
    const ms=S.mus[m];
    const target = ctx.weeklyCap ? Math.min(ms.target, ctx.weeklyCap) : ms.target;
    const eff = ms.ladder==="DELOAD" ? target*K.DELOAD_SET_MULT
              : ms.tier==="MAINTAIN" ? target*0.33 : target;
    needed[m]=Math.max(1, Math.ceil(eff/K.SESSION_CAP));
    deficit[m]=eff - ms.fsWeek;
    const hrs = ms.lastHard ? daysBetween(ms.lastHard,date)*24 : 999;
    if(NO_DIRECT.has(m)) continue;                                  // SEL-04
    if(hrs>=K.SPACING_H && ms.doneWeek<needed[m] && deficit[m]>0) eligible.push(m);
  }
  /* A flagged joint can leave a muscle with no legal exercise. Scheduling it
     anyway produces an empty session; the right move is to spend the day on
     muscles that CAN still be trained. */
  const blockNow = Math.floor(daysBetween(st.startDate||date, date)/(7*K.ROTATION_BLOCK_WEEKS));
  const trainable = eligible.filter(m=>candidatesFor(m, blockNow).length>0);
  const shut = eligible.filter(m=>!trainable.includes(m));
  if(shut.length) notes.push({rule:"SAF-05",
    text:`Nothing here trains ${listOf(shut.map(m=>MUSCLE_LABEL[m].toLowerCase()))} without loading a joint you've flagged, so today goes elsewhere. ${shut.length>1?"They come":"It comes"} back as the flag fades.`});
  let bumpRir=0, setScale=1;
  let pool = trainable;
  if(!pool.length && isTrainingDay){
    pool=[MUSCLES.slice().sort((a,b)=>deficit[b]-deficit[a])[0]];
    bumpRir=2; setScale=0.75;
    notes.push({rule:"SEL-03", text:"Everything's inside its 48-hour window, so today is lighter on purpose."});
  }
  const tierRank={PRIORITY:0,STANDARD:1,MAINTAIN:2};
  pool = pool.slice().sort((a,b)=>
    (tierRank[S.mus[a].tier]-tierRank[S.mus[b].tier]) || (deficit[b]-deficit[a]));

  /* Frequency is never a decision variable — it is ceil(V / SESSION_CAP)
     (SEL-02). But at cold start every muscle is eligible at once, so a greedy
     fill would put the whole body into day 1 and leave the clock as the only
     brake. Spread what is eligible over the training days that are actually
     left in this ISO week, so each muscle lands on the number of days its own
     weekly target implies rather than all of them landing today. */
  const thisWeek = isoWeek(date);
  let daysLeft = 0;
  for(let i=0;i<7;i++){ const d=addDays(date,i);
    if(isoWeek(d)!==thisWeek) break;
    if(st.days.includes(dow(d))) daysLeft++; }
  daysLeft = Math.max(1, daysLeft);
  const perDay = clamp(Math.ceil(pool.length/daysLeft), 1, K.MAX_MUSCLES_PER_DAY);
  if(pool.length>perDay){
    notes.push({rule:"SEL-01", text:`${pool.length} muscles are due this week — ${perDay} today, the rest across your remaining ${daysLeft===1?"day":daysLeft+" days"}.`});
    pool = pool.slice(0, perDay);
  }

  /* --- Phase 4: exercise selection (SEL-04..06) ----------------- */
  const block = Math.floor(daysBetween(st.startDate,date)/(7*K.ROTATION_BLOCK_WEEKS));
  const flagged = JOINTS.filter(j=>(S.irr[j]||{sev:0}).sev>=6);
  if(flagged.length) notes.push({rule:"SAF-05",
    text:`${listOf(flagged.map(j=>j.replace("_"," ")))} flagged, so anything that loads ${flagged.length>1?"them":"it"} hard is off today's list. The muscles still get trained — through a different door.`});
  const usedPatterns=new Set(), slots=[]; let minutes=0;
  const budget = st.minutes;
  for(const m of pool){
    const ms=S.mus[m];
    const idx = st.indexLift[m];
    if(slots.length >= K.MAX_SLOTS) break;
    const cands = candidatesFor(m, block).filter(e=>!usedPatterns.has(e.pattern));
    const chosen=[];
    if(idx && LIBX[idx] && available(LIBX[idx]) && jointOK(LIBX[idx]) && !usedPatterns.has(LIBX[idx].pattern)) chosen.push(LIBX[idx]);
    const wantEx = ms.tier==="PRIORITY" ? 2 : 1;   // specialisation is funded by taking from elsewhere
    for(const e of cands){ if(chosen.length>=wantEx) break; if(chosen.some(c=>c.id===e.id)) continue; chosen.push(e); }
    if(!chosen.length) continue;

    const target = ctx.weeklyCap ? Math.min(ms.target, ctx.weeklyCap) : ms.target;
    const eff = ms.ladder==="DELOAD" ? target*K.DELOAD_SET_MULT
              : ms.tier==="MAINTAIN" ? target*0.33 : target;
    let want = Math.max(1, Math.round(Math.min(K.SESSION_CAP, eff/needed[m]) * setScale));
    if(m==="obliques") want = Math.min(want, K.OBLIQUE_MAX_DIRECT);   // SEL-05

    for(const e of chosen){
      if(slots.length >= K.MAX_SLOTS) break;
      const es=exState(e.id);
      const share = Math.max(1, Math.round(want/chosen.length));
      const sets = Math.min(share, ctx.maxSets);
      const est = e.setup + sets*(e.rest + 32);
      if(minutes + est > budget*60 && slots.length){ notes.push({rule:"CAP-01",
        text:`Ran out of your ${budget} minutes — ${MUSCLE_LABEL[m].toLowerCase()} work moves to your next session.`}); break; }
      minutes += est; usedPatterns.add(e.pattern);
      slots.push(buildSlot(e, es, m, sets, ctx, ms, bumpRir, date));
    }
  }

  /* --- order: index lifts first, unfailsafe never last-fatigued -- */
  slots.sort((a,b)=> (b.isIndex?1:0)-(a.isIndex?1:0) || (a.risk-b.risk));
  slots.forEach((s,i)=>s.pos=i+1);

  const calib = calibrationTarget(slots, ctx, date);          // PRG-10
  if(calib){ const sl=slots.find(x=>x.ex===calib); if(sl){ sl.calibration=true;
    notes.push({rule:"PRG-10", text:`Last set of ${sl.name.toLowerCase()} is a calibration set today — stop where you normally would, tap your RIR, then keep going to a rep you can't finish. It's the only way I can tell "stronger" apart from "under-reporting".`}); } }

  /* SEL-06: one heavy compound per Tier-A muscle is protected from the time
     trim. Frequency is negligible for hypertrophy but significant for
     strength, and the strength side is what these slots defend. */
  for(const sl of slots){
    const w=(S.settings.w||W_MALE)[sl.muscle]||0;
    sl.protected = (w>=TIER_A && sl.cls!=="isolation") || sl.isIndex;
  }

  /* --- hard floor: never below 1 working set per scheduled muscle */
  if(!slots.length && isTrainingDay && pool.length)
    notes.push({rule:"OVERCONSTRAINED", text:"Your time budget and the 48-hour spacing rule collided — nothing fits today."});

  return {date, slots, notes, diffs, minutes:Math.round(minutes/60), ctx, ramping,
          phase:st.phase, restricted:S.restricted};
}

function available(e){
  const eq=S.settings.gym.equipment;
  return e.equip.every(x=>eq.includes(x));
}
/* A joint you have told the app about has to change what it PRESCRIBES, not
   merely how close to failure it takes you. Anything above a 5 pulls exercises
   that load that joint out of selection entirely; the muscle still gets
   trained, through a different door. */
function jointOK(e){
  return !Object.keys(e.joints||{}).some(j=>{
    const r=S.irr[j]; if(!r) return false;
    const load=e.joints[j]||0;
    // 6-7: drop the lifts that load it hard. 8+: drop anything that loads it
    // at all. A joint listed at 0 is listed because it is INVOLVED but not
    // loaded — excluding those removed almost the whole library.
    return (r.sev>=8 && load>=1) || (r.sev>=6 && load>=2);
  });
}
function candidatesFor(m, block){
  // Prime movers only if any exist for this muscle; a 0.5 synergist is a
  // fallback, never the reason a slot is labelled with that muscle.
  const ok = e => available(e) && jointOK(e);
  const prime = LIB.filter(e=>ok(e) && (e.contributions[m]||0)>=1.0);
  const list = prime.length ? prime : LIB.filter(e=>ok(e) && (e.contributions[m]||0)>=0.5);
  // rotating shell: deterministic 8-week rotation, so it stays auditable
  const rot=[...list].sort((a,b)=>a.id<b.id?-1:1);
  const off = block % Math.max(1,rot.length);
  return rot.slice(off).concat(rot.slice(0,off));
}

function buildSlot(e, es, m, sets, ctx, ms, bumpRir, date){
  const set = loadableSet(e, S.settings.gym);
  let load = es.load;
  if(load==null) load = null;                       // cold start: measured on first exposure
  else if(ctx.loadCap) load = nearestLoad(set, load*ctx.loadCap);
  let rir = Math.max(e.cls==="isolation"?K.RIR_ISOLATION:K.RIR_COMPOUND, ctx.minRir) + bumpRir;
  if(ms.ladder==="DELOAD") rir = Math.max(rir, K.DELOAD_RIR);

  /* --- FAI-04 failure gate. All five must hold. ----------------- */
  const spotterFresh = (Date.now()-(S.settings.spotterAt||0)) < 4*3600e3;
  const jointsClear = Object.keys(e.joints).every(j=>!S.irr[j]||S.irr[j].sev===0);
  const failShare = ms.failWeek < K.FAILURE_SHARE*ms.target;
  const allowFailure = ctx.allowFailure && (e.failSafe || spotterFresh) && jointsClear
      && failShare && S.settings.screening==="CLEAR" && !S.restricted;
  /* SAF-PIN: a lift where a failed rep can pin or drop load on trunk,
     neck or head is never prescribed at RIR<=1 without a spotter flag
     set fresh THIS session. The flag defaults false and is never
     remembered — that is the whole point of it. */
  if(!e.failSafe && !spotterFresh) rir = Math.max(rir, 2);

  const irritated = Object.keys(e.joints).filter(j=>S.irr[j]&&S.irr[j].sev>=4);
  return { ex:e.id, name:e.name, muscle:m, sets, reps:es.target||e.band[0],
    load, loadSet:set, rir, rest:e.rest, isIndex:S.settings.indexLift[m]===e.id,
    risk:(e.failSafe?0:2)+e.failRisk, allowFailure, cls:e.cls,
    calibration:false, needsSeed: es.load==null,
    irritated, romSensitive:e.romSensitive, romCue:e.romCue,
    band:[es.lo,es.hiEff] };
}

/* ========================= GITHUB SYNC =============================
   The authoritative copy of every set is an ordinary file in a private
   git repo. Portability is by construction: the export format IS the
   storage format, so `git clone` + a text editor recovers everything
   forever, offline, with no tool from this app.

   The token is typed once per device and lives in IndexedDB. It is never
   in the page source. An attacker who reads index.html learns the repo
   name and the schema; that is the entire disclosure, and obscurity was
   never the control. Scope it to Contents:read+write on ONE private repo.
   =================================================================== */
const Sync = {
  token:null, owner:null, repo:null, pending:[], timer:null, state:"idle", lastOk:null, lastErr:null,
  async init(){
    const tok = await kvGet("gh_token");
    this.token = typeof tok === "string" && tok ? tok : null;
    const r = await kvGet("gh_repo");
    if(r && typeof r.owner === "string" && typeof r.repo === "string"){ this.owner=r.owner; this.repo=r.repo; }
    const lo = await kvGet("gh_lastok");
    this.lastOk = typeof lo === "number" ? lo : null;
    const pend = await kvGet("gh_pending");
    this.pending = Array.isArray(pend) ? pend : [];
  },
  configured(){ return !!(this.token && this.owner && this.repo); },
  queue(ev){
    if(!this.configured()) return;
    this.pending.push(ev);
    // Persist immediately: a tab discard inside the 15-second flush window
    // used to lose the queue outright while the UI still claimed a clean backup.
    kvPut("gh_pending", this.pending).catch(()=>{});
    this.schedule();
  },
  schedule(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 15000); },
  async api(path, opts){
    const r = await fetch("https://api.github.com"+path, Object.assign({
      headers:{ "Authorization":"Bearer "+this.token, "Accept":"application/vnd.github+json",
                "X-GitHub-Api-Version":"2022-11-28" } }, opts||{}));
    if(r.status===401||r.status===403){ this.state="unauthorized"; throw new Error("auth"); }
    return r;
  },
  async getSha(path){
    const r = await this.api(`/repos/${this.owner}/${this.repo}/contents/${path}`);
    if(r.status===404) return null;
    const j = await r.json(); return j.sha||null;
  },
  async putFile(path, bytesOrText, message){
    const b64 = typeof bytesOrText==="string" ? b64enc(new TextEncoder().encode(bytesOrText)) : b64enc(bytesOrText);
    const sha = await this.getSha(path);
    const r = await this.api(`/repos/${this.owner}/${this.repo}/contents/${path}`, {
      method:"PUT", body: JSON.stringify({message, content:b64, sha:sha||undefined}) });
    if(!r.ok) throw new Error("put "+r.status);
    return r.json();
  },
  async getFileText(path){
    const r = await this.api(`/repos/${this.owner}/${this.repo}/contents/${path}`);
    if(r.status===404) return null;
    const j = await r.json();
    return new TextDecoder().decode(b64dec(j.content.replace(/\n/g,"")));
  },
  /* One file per training date. A 25-set session is ~5 KB, so every object
     this app will ever write stays inside the Contents API's "1 MB or
     smaller: all features supported" band. Directory sharded YYYY/MM keeps
     ~31 files against the API's 1,000-file-per-directory ceiling. */
  async flush(){
    if(!this.configured() || !this.pending.length) return;
    /* Never re-render mid-session from a background flush: it rebuilds the
       load <select> and the rep stepper under the user's thumb, fifteen
       seconds after every set. Only the Settings screen shows sync state. */
    this.state="syncing"; if(VIEW==="setup") render();
    /* Snapshot the batch. Clearing the whole queue after the round trip threw
       away everything logged DURING the upload, while reporting success. */
    const batch = this.pending.slice();
    const batchIds = new Set(batch.map(e=>e.id));
    const byDate={};
    for(const ev of batch) (byDate[ev.d]=byDate[ev.d]||[]).push(ev);
    try{
      for(const [d, evs] of Object.entries(byDate)){
        const path = `log/${d.slice(0,4)}/${d.slice(5,7)}/${d}.ndjson`;
        const existing = await this.getFileText(path);
        const have = new Set((existing||"").split("\n").filter(Boolean).map(l=>{
          try{ return JSON.parse(l).id; }catch(e){ return null; } }));
        const add = evs.filter(e=>!have.has(e.id)).map(e=>JSON.stringify(e)).join("\n");
        if(!add) continue;
        const body = (existing? existing.replace(/\n*$/,"\n") : "") + add + "\n";
        await this.putFile(path, body, `log ${d}: +${evs.length}`);
      }
      await this.putFile("state.json", JSON.stringify(snapshot(),null,1), "state snapshot");
      this.pending = this.pending.filter(e=>!batchIds.has(e.id));
      this.lastOk=Date.now(); this.state="ok"; this.lastErr=null;
      await kvPut("gh_pending", this.pending); await kvPut("gh_lastok",this.lastOk);
    }catch(err){
      this.state = this.state==="unauthorized"?"unauthorized":"error";
      this.lastErr = String(err.message||err);
      await kvPut("gh_pending", this.pending);
    }
    if(VIEW==="setup") render();
  },
  async listDir(path){
    const r = await this.api(`/repos/${this.owner}/${this.repo}/contents/${path}`);
    if(r.status===404) return [];
    if(!r.ok) throw new Error("list "+r.status);
    const j = await r.json();
    return Array.isArray(j) ? j : [];
  },
  /* The eviction banner tells the user to restore from GitHub, so that has to
     exist. Walks log/YYYY/MM/, parses the NDJSON back into events, and merges
     by id — the repo IS the backup, and reading it back must not require a
     separate export file the user may never have made. */
  async pullAll(onProgress){
    const out=[];
    for(const year of await this.listDir("log")){
      if(year.type!=="dir") continue;
      for(const month of await this.listDir(year.path)){
        if(month.type!=="dir") continue;
        for(const f of await this.listDir(month.path)){
          if(!/\.ndjson$/.test(f.name)) continue;
          onProgress && onProgress(f.path);
          const txt = await this.getFileText(f.path);
          for(const line of (txt||"").split("\n")){
            if(!line.trim()) continue;
            try{ out.push(JSON.parse(line)); }catch(e){}
          }
        }
      }
    }
    return out;
  },
  staleDays(){ return this.lastOk ? (Date.now()-this.lastOk)/864e5 : (S.events.length?999:0); },
};
function b64enc(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(b64){ const s=atob(b64); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a; }
function snapshot(){
  return { generated: new Date().toISOString().slice(0,10), settings:S.settings,
    exercises:S.ex, muscles:S.mus, irritation:S.irr, bodyweightTrend:bwTrend(),
    note:"Derived state. The log/ directory is the system of record; this file is recomputable from it." };
}

/* =================== PHOTO ENCRYPTION (WebCrypto) ==================
   Photos are encrypted before they ever reach the repo. Not because of
   burglars — because automated content review on a private repo could
   false-positive on body photos, and that costs the account holding his
   freelance work. The training LOG stays plaintext on purpose: an
   encrypted log silently downgrades "always get a plain file out" to
   "portable to this exact app, if I remember the passphrase."
   PBKDF2 600k (OWASP) -> AES-GCM 256. WebCrypto has no Argon2 and
   pulling in a WASM one would reintroduce the supply-chain risk we
   just eliminated.
   =================================================================== */
const Photo = {
  key:null,
  async salt(){
    let s = await kvGet("photo_salt");
    if(!s){ s = crypto.getRandomValues(new Uint8Array(16)); await kvPut("photo_salt", s);
      if(Sync.configured()) try{ await Sync.putFile("photos/salt.b64", b64enc(s), "photo salt"); }catch(e){} }
    return s instanceof Uint8Array ? s : new Uint8Array(s);
  },
  async unlock(passphrase){
    const salt = await this.salt();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    this.key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
    return this.key;
  },
  async encrypt(bytes, photoId, iso){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const aad = new TextEncoder().encode(photoId+"|"+iso);
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv, additionalData:aad, tagLength:128}, this.key, bytes));
    const out = new Uint8Array(4+12+ct.length);
    out.set(new TextEncoder().encode("VBP1"),0); out.set(iv,4); out.set(ct,16);
    return out;
  },
  async decrypt(blob, photoId, iso){
    const iv = blob.slice(4,16), ct = blob.slice(16);
    const aad = new TextEncoder().encode(photoId+"|"+iso);
    return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv, additionalData:aad, tagLength:128}, this.key, ct));
  },
  /* Re-encode through a canvas at <=1200px. This drops the EXIF block
     (including GPS) because it re-encodes from pixel data, and keeps a
     year of weekly photos near 15 MB. */
  /* Decode with EXIF orientation honoured — without it a portrait shot from
     an iPhone comes out sideways. Falls back to an <img> element, which Safari
     uses to decode HEIC natively when createImageBitmap will not. */
  async decode(file){
    try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }
    catch(e){
      const url=URL.createObjectURL(file);
      try{
        const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
        return img;
      } finally { setTimeout(()=>URL.revokeObjectURL(url), 1000); }
    }
  },
  /* Compress to a BUDGET, not a guess. Re-encode through a canvas (which
     drops EXIF, including GPS) and walk quality down, then dimensions, until
     the file is under target. A 4 MB phone photo lands around 120-180 KB;
     a year of weekly photos is ~8 MB. Nothing in this stack bills for
     storage, but a repo that swells past GitHub's ~1 GB guidance is a repo
     that becomes painful to clone, and clone is the whole restore story. */
  PHOTO_TARGET: 180*1024,
  PHOTO_HARD_CAP: 320*1024,
  async downscale(file){
    const src = await this.decode(file);
    const w0 = src.width||src.naturalWidth, h0 = src.height||src.naturalHeight;
    let maxEdge=1200, q=0.72, best=null;
    for(let i=0;i<8;i++){
      const scale = Math.min(1, maxEdge/Math.max(w0,h0));
      const c = document.createElement("canvas");
      c.width = Math.max(1,Math.round(w0*scale)); c.height = Math.max(1,Math.round(h0*scale));
      c.getContext("2d").drawImage(src,0,0,c.width,c.height);
      const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
      if(!blob) break;
      best = blob;
      if(blob.size <= this.PHOTO_TARGET) break;
      if(q > 0.5) q = Math.round((q-0.08)*100)/100; else maxEdge = Math.round(maxEdge*0.85);
    }
    if(!best) throw new Error("could not encode the photo");
    if(best.size > this.PHOTO_HARD_CAP) throw new Error("photo would not compress under "+Math.round(this.PHOTO_HARD_CAP/1024)+" KB");
    return { bytes:new Uint8Array(await best.arrayBuffer()), size:best.size, original:file.size,
             width:Math.round(w0*Math.min(1,maxEdge/Math.max(w0,h0))), quality:q };
  }
};
const DECRYPT_MD = `# How to decrypt these photos without this app

Files are named photos/YYYY/YYYY-MM-DD.jpg.enc and are laid out as:

    bytes 0..3    magic "VBP1"
    bytes 4..15   AES-GCM IV (12 bytes)
    bytes 16..    ciphertext with a 128-bit tag appended

Key derivation: PBKDF2-HMAC-SHA256, 600000 iterations, over the salt in
photos/salt.b64 (base64, 16 bytes), output 256-bit AES-GCM key.
Additional authenticated data: the UTF-8 string "<photoId>|<YYYY-MM-DD>".

    import base64, hashlib, sys
    from cryptography.hazmat.primitives.ciphers.aead import AESGCM
    salt = base64.b64decode(open("photos/salt.b64").read().strip())
    key  = hashlib.pbkdf2_hmac("sha256", sys.argv[2].encode(), salt, 600000, 32)
    raw  = open(sys.argv[1], "rb").read()
    assert raw[:4] == b"VBP1"
    pid  = sys.argv[3]; iso = sys.argv[4]
    out  = AESGCM(key).decrypt(raw[4:16], raw[16:], f"{pid}|{iso}".encode())
    open(sys.argv[1].replace(".enc",""), "wb").write(out)

Run: python decrypt.py photos/2026/2026-09-10.jpg.enc "your passphrase" <photoId> 2026-09-10

The training log is NOT encrypted, on purpose. log/**.ndjson is one JSON
object per line and needs no key, no tool, and no running app.
`;

/* ================== NOTES THAT DO SOMETHING =======================
   A free-text box that only stores text is a diary. This one is scanned for
   the two things that should change a plan — a joint you have hurt, and a
   symptom that means stop training and see someone — and then ASKS. It never
   acts on parsed text silently: matching is a suggestion, confirmation is the
   user's. Deterministic keywords, no model, so there is nothing to inject.
   ================================================================== */
const JOINT_WORDS = {
  shoulder:["shoulder","delt","rotator","cuff","labrum","ac joint"],
  lumbopelvic:["back","lumbar","spine","disc","si joint","erector"],
  knee:["knee","patella","meniscus","acl","quad tendon"],
  elbow:["elbow","tricep tendon","golfer","tennis elbow"],
  wrist_hand:["wrist","hand","forearm tendon","thumb","grip pain"],
  hip:["hip","glute med","groin","adductor","hip flexor"],
};
const HURT_WORDS = ["hurt","injur","pain","tweak","strain","sore","pulled","ache",
  "sprain","impinge","tendon","inflam","stiff","clicking","popped","sharp"];
const RED_WORDS = ["chest pain","numb","tingl","faint","dizzy","black out","cola",
  "can't straighten","cannot straighten","night pain","fever","swollen calf","radiating"];

function scanNote(text){
  const t=(text||"").toLowerCase();
  const red = RED_WORDS.filter(w=>t.includes(w));
  const hurt = HURT_WORDS.some(w=>t.includes(w));
  const joints = Object.keys(JOINT_WORDS).filter(j=>JOINT_WORDS[j].some(w=>t.includes(w)));
  return { red, joints: hurt ? joints : [], hurt };
}

/* ================= SESSION HELPERS (the useful bits) ==============
   What a lifter actually needs mid-set: what they did last time, a way out
   when the machine is taken, and a way to fix a mistyped number. The first
   is the highest-value line of text a training app can render; the second is
   the single most-repeated complaint about every adaptive app in the field —
   a plan that assumes the gym is empty is a plan that dies at 5pm.
   ================================================================== */
function lastPerformance(exId, beforeDate){
  for(let i=S.sessions.length-1;i>=0;i--){
    const sess=S.sessions[i];
    if(sess.date>=beforeDate) continue;
    const sets=sess.sets.filter(x=>x.ex===exId && !x.warmup);
    if(sets.length) return {date:sess.date, sets};
  }
  return null;
}
/* Substitutes must be REAL substitutes: same muscle as a prime mover, present
   in this gym, and not already in today's session. Ordered so the cleanest
   autoregulation signal comes first — a machine you can fail on safely beats a
   free-weight variant whose numbers are noisier. */
function alternativesFor(exId, muscle, usedIds){
  const cur=LIBX[exId];
  const score = e => (1/Math.max(0.01, relIncrementOf(e))) + (2-e.stability) + (e.failSafe?2:0);
  return LIB.filter(e=> e.id!==exId && available(e) && jointOK(e) && !usedIds.includes(e.id)
      && (e.contributions[muscle]||0) >= (cur && (cur.contributions[muscle]||0)>=1 ? 1 : 0.5))
    .sort((a,b)=> score(b)-score(a))
    .slice(0,4);
}
function relIncrementOf(e){
  const set=loadableSet(e, S.settings.gym);
  if(set.length<2) return 1;
  const mid=set[Math.floor(set.length/3)] || set[0];
  const nx=nextLoad(set, mid);
  return nx ? (nx-mid)/mid : 1;
}
/* Plan edits are events, so a swap or a time cut is as auditable as a load
   change and survives a reload like everything else. */
function applyPlanEdits(plan, date){
  for(const ed of (S.planEdits[date]||[])){
    if(ed.op==="swap"){
      const i=plan.slots.findIndex(s=>s.ex===ed.from);
      if(i<0) continue;
      const e=LIBX[ed.to]; if(!e) continue;
      const es=exState(ed.to), old=plan.slots[i], pctx=plan.ctx||{};
      /* Every safety field is RE-DERIVED for the new exercise. Inheriting rir
         and allowFailure from the lift being replaced meant swapping a cable
         fly for a barbell bench carried "last set to failure" along with it,
         straight past SAF-PIN. */
      const spotterFresh = (Date.now()-(S.settings.spotterAt||0)) < 4*3600e3;
      const jointsClear = Object.keys(e.joints||{}).every(j=>!S.irr[j] || S.irr[j].sev===0);
      const ms = S.mus[old.muscle] || {failWeek:0, target:1};
      let rir = Math.max(e.cls==="isolation"?K.RIR_ISOLATION:K.RIR_COMPOUND, pctx.minRir||1);
      if(!e.failSafe && !spotterFresh) rir = Math.max(rir, 2);
      const allowFailure = pctx.allowFailure!==false && (e.failSafe||spotterFresh) && jointsClear
        && ms.failWeek < K.FAILURE_SHARE*ms.target && S.settings.screening==="CLEAR" && !S.restricted;
      const set = loadableSet(e, S.settings.gym);
      let load = es.load;
      if(pctx.loadCap && load!=null) load = nearestLoad(set, load*pctx.loadCap);
      // A calibration set only survives onto a lift that is a legal site for one.
      const keepCalib = !!old.calibration && e.failSafe && e.cls==="isolation" && jointsClear && allowFailure;
      if(old.calibration && !keepCalib)
        (plan.notes=plan.notes||[]).push({rule:"PRG-10",
          text:`Calibration is off today — ${e.name} isn't a safe place to take a set to genuine failure.`});
      plan.slots[i]=Object.assign({}, old, { ex:e.id, name:e.name, cls:e.cls,
        loadSet: set, load, rir, allowFailure,
        reps: es.target||e.band[0], band:[es.lo,es.hiEff], rest:e.rest,
        risk:(e.failSafe?0:2)+e.failRisk,
        irritated: Object.keys(e.joints||{}).filter(j=>S.irr[j]&&S.irr[j].sev>=4),
        needsSeed: es.load==null, romSensitive:e.romSensitive, romCue:e.romCue,
        isIndex:false, calibration:keepCalib, substitutedFrom:ed.from, subReason:ed.reason });
    } else if(ed.op==="time"){
      /* CAP-01 order matters. Trim SETS from the least visually-weighted
         muscles first — a set is the cheapest thing to give back, and the
         evidence for the marginal set is much weaker than for the exercise
         existing at all. Only once every non-index lift is down to one set do
         whole exercises come off, and an index lift never does: it is the
         measurement instrument, and dropping it blinds the planner.
         Silently doing nothing would be the worst outcome, so if the budget
         still cannot be met the plan says so rather than pretending. */
      const w = S.settings.w || W_MALE;
      const cost = sl => { const e=LIBX[sl.ex]; return (e?e.setup:45) + sl.sets*((e?e.rest:120)+32); };
      const total = () => plan.slots.reduce((a,b)=>a+cost(b),0);
      const budget = ed.minutes*60;
      let guard=0;
      while(total() > budget && guard++ < 60){
        const trimmable = plan.slots.filter(sl=>sl.sets>1)
          .sort((a,b)=>(w[a.muscle]||0)-(w[b.muscle]||0));
        if(trimmable.length){ trimmable[0].sets -= 1; continue; }
        const droppable = plan.slots.filter(sl=>!sl.isIndex && !sl.protected)
          .sort((a,b)=>(w[a.muscle]||0)-(w[b.muscle]||0));
        if(!droppable.length) break;
        plan.slots = plan.slots.filter(sl=>sl!==droppable[0]);
      }
      plan.minutes = Math.round(total()/60);
      plan.timeCut = ed.minutes;
      if(plan.minutes > ed.minutes){
        (plan.notes=plan.notes||[]).push({rule:"CAP-01",
          text:`Trimmed as far as it goes — this is ${plan.minutes} minutes, not ${ed.minutes}. What's left is one set of each index lift, and those are the measurements the whole plan runs on. Cutting further would blind it.`});
      } else {
        (plan.notes=plan.notes||[]).push({rule:"CAP-01",
          text:`Cut to about ${plan.minutes} minutes. Sets came off your lowest-priority muscles first; the index lifts are untouched.`});
      }
    } else if(ed.op==="sets"){
      const sl=plan.slots.find(s=>s.ex===ed.ex);
      if(sl) sl.sets=Math.max(1, Math.min(8, ed.sets));
    } else if(ed.op==="defer"){
      /* Someone is on the machine. Deferring keeps the lift and its whole
         history — it just stops being next. That is a different thing from a
         swap, and conflating them was the gap: a swap says "not this exercise",
         a defer says "not this minute". */
      const i=plan.slots.findIndex(s=>s.ex===ed.ex);
      if(i>=0){ const [sl]=plan.slots.splice(i,1); sl.deferred=(sl.deferred||0)+1; plan.slots.push(sl); }
    } else if(ed.op==="drop"){
      plan.slots = plan.slots.filter(s=>s.ex!==ed.ex);
    }
  }
  plan.slots.forEach((sl,i)=>sl.pos=i+1);
  // Any edit can change the session's length; the header must not lie, and the
  // "nothing to cut" guard reads this same number.
  plan.minutes = Math.round(plan.slots.reduce((a,sl)=>{
    const e=LIBX[sl.ex]; return a + (e?e.setup:45) + sl.sets*((e?e.rest:120)+32);
  },0)/60);
  return plan;
}
/* Edits replay onto a COPY. Applying them to the stored plan mutated it in
   place and re-ran on every render, so a time cut appended its CAP-01 note once
   per render and the duplicates leaked into the persisted planStart payload,
   the GitHub sync and the export. */
function clonePlan(p){
  return Object.assign({}, p, {
    slots:(p.slots||[]).map(x=>Object.assign({}, x)),
    notes:(p.notes||[]).slice(),
    diffs:(p.diffs||[]).slice(),
  });
}
