let VIEW="session";
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LIVE = null;   // {date, logged:{exId:[...]}} for the in-progress session
let OPEN_EX = null;  // the one exercise showing its full logging surface
const EXPANDED = new Set();   // coach notes whose long form is showing
/* When a lift finishes, open the next unfinished one. Nobody wants to tap a
   header to find out where they are. */
function advanceIfComplete(exId){
  const date=todayISO(), p=ensurePlan(date);
  const count = ex => S.events.filter(e=>e.type==="set" && !S.voided.has(e.id)
    && e.payload.d===date && e.payload.ex===ex && !e.payload.warmup).length;
  const slot = p.slots.find(s=>s.ex===exId);
  if(!slot || count(exId) < slot.sets) return;
  const next = p.slots.find(s=>count(s.ex) < s.sets);
  OPEN_EX = next ? next.ex : null;
}

function render(){
  $("#boot").classList.add("hide");
  $("#tabs").classList.remove("hide");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#topdate").textContent = new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("#v-"+VIEW).classList.add("on");
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.v===VIEW?"true":"false"));
  ({session:renderSession, log:renderLog, setup:renderSetup})[VIEW]();
}
function go(v){ VIEW=v; render(); window.scrollTo(0,0); }

function syncBanner(){
  if(Sync.state==="unauthorized") return `<div class="banner bad">Backup is paused — GitHub rejected the token. Sets are still saving locally and will upload once you reconnect below.</div>`;
  const d=Sync.staleDays();
  if(Sync.configured() && d>2) return `<div class="banner warn">Last backup was ${Math.floor(d)} days ago. ${Sync.pending.length} entries waiting.</div>`;
  return "";
}

/* --------------------------- THE SESSION ---------------------------
   One screen. The plan and the logging surface were two views describing the
   same thing, which meant every set cost a tab switch and the "start" button
   was a ceremony with no purpose. Now the session IS the home screen.

   Rule ids live behind a disclosure rather than on the face of it: they are
   how you audit a decision you distrust, not how you read a workout.
   ------------------------------------------------------------------- */
function renderSession(){
  const date=todayISO(), p=ensurePlan(date);
  let h = syncBanner();

  if(S.restricted) h += `<div class="banner warn">You've been training very frequently, or training on a sore joint. This week is capped and the body numbers are hidden. If training is feeling compulsory rather than useful, that's worth talking to someone about.</div>`;

  if(p.blocked){
    $("#v-session").innerHTML = h + `<div class="card"><h2>Not planning a session</h2>
      <p class="sub">${esc(p.reason)}</p>
      <button class="btn wide" data-act="unblock">A clinician has cleared me</button></div>`;
    return;
  }

  const logged={};
  for(const ev of S.events) if(ev.type==="set" && ev.payload.d===date && !S.voided.has(ev.id))
    (logged[ev.payload.ex]=logged[ev.payload.ex]||[]).push(Object.assign({_id:ev.id}, ev.payload));

  if(!p.slots.length){
    const next = nextTrainingDay(date);
    $("#v-session").innerHTML = h + `<div class="card"><h2>Rest day</h2>
      <p class="sub">Nothing due. Muscles need 48 hours between hard sessions, and the sets you've already banked this week are what count.</p>
      ${next?`<p class="sub">Next session: <b>${esc(next)}</b>.</p>`:""}
      <button class="btn wide" data-act="trainanyway">I want to train anyway</button></div>`
      + coachCard(p);
    return;
  }

  /* SAF-PIN, surfaced where it is actionable. The flag defaults false every
     session and is never remembered — so it has to be asked for on the day,
     and only when a lift that can pin you is actually on the list. */
  const spotterFresh = (Date.now()-(S.settings.spotterAt||0)) < 4*3600e3;
  const pinRisk = p.slots.filter(s=>LIBX[s.ex] && !LIBX[s.ex].failSafe);
  if(pinRisk.length){
    h += spotterFresh
      ? `<p class="mini" style="margin:0 0 8px 4px">Spotter set for the next few hours.</p>`
      : `<div class="card tight"><div class="row"><div class="grow mini">${esc(listOf(pinRisk.map(s=>s.name)))} stays two reps from failure without a spotter or pins.</div>
          <button class="btn" data-act="spotter">I have them</button></div></div>`;
  }

  const doneCount = p.slots.filter(s=>(logged[s.ex]||[]).filter(x=>!x.warmup).length >= s.sets).length;
  h += `<div class="card">
    <div class="row"><div class="grow">
      <h2>${doneCount?`${doneCount} of ${p.slots.length} done`:"Today"}</h2>
      <div class="sub">${esc(sessionLine(p))}</div></div>
      <button class="btn" data-act="timecut">Short on time</button></div></div>`;

  /* One card is live at a time; everything else is a single tappable row.
     Five identical blocks each carrying a 33-option picker was five times the
     same thing, and the one that mattered was whichever you were standing in
     front of. Completed lifts collapse to their numbers. */
  const firstOpen = p.slots.filter(s=>(logged[s.ex]||[]).filter(x=>!x.warmup).length < s.sets)[0];
  const openId = (OPEN_EX && p.slots.some(s=>s.ex===OPEN_EX)) ? OPEN_EX
               : (firstOpen ? firstOpen.ex : null);

  for(const s of p.slots){
    const e=LIBX[s.ex], all=logged[s.ex]||[];
    const done=all.filter(x=>!x.warmup);
    const complete = done.length>=s.sets;
    const open = s.ex===openId;

    if(!open){
      const summary = complete
        ? `${esc(fmtL(e,done[0].load))} × ${done.map(x=>x.reps).join(", ")}`
        : done.length ? `${done.length} of ${s.sets} · ${esc(fmtL(e,done[done.length-1].load))}`
                      : `${s.sets} × ${s.reps}${s.load!=null?" · "+esc(fmtL(e,s.load)):""}`;
      h+=`<button class="exrow${complete?" is-done":""}" data-act="openex" data-ex="${s.ex}">
        <span class="mark">${complete?"✓":s.pos}</span>
        <span class="grow"><b>${esc(s.name)}</b><span class="mini"> ${esc(MUSCLE_LABEL[s.muscle])}${s.deferred?" · moved down":""}</span></span>
        <span class="mini num">${summary}</span></button>`;
      continue;
    }

    const last = lastPerformance(s.ex, date);
    const alts = complete ? [] : alternativesFor(s.ex, s.muscle, p.slots.map(x=>x.ex));
    h+=`<div class="card ${complete?"spine ok":s.isIndex?"spine pri":""}">
      <div class="row"><div class="grow">
        <h3><span class="mini num" style="margin-right:6px">${s.pos}</span>${esc(s.name)}</h3>
        <div class="mini">${MUSCLE_LABEL[s.muscle]} · ${s.sets} × ${s.reps}${s.allowFailure?" · last set to failure":` · ${s.rir} in reserve`}${s.deferred?" · moved down once":""}</div>
      </div>${complete?`<span class="pill ok">done</span>`:""}</div>`;
    if(alts.length && !complete)
      h+=`<p class="mini" style="margin-top:6px">If it's busy · ${esc(alts[0].name)}${alts[1]?" or "+esc(alts[1].name):""}</p>`;

    if(last) h+=`<p class="mini" style="margin-top:6px">Last time · ${last.sets.map(x=>x.reps).join(", ")} reps at ${esc(fmtL(e,last.sets[0].load))}</p>`;
    if(s.substitutedFrom) h+=`<p class="mini">Swapped in for ${esc((LIBX[s.substitutedFrom]||{}).name||s.substitutedFrom)}.</p>`;
    if(s.irritated && s.irritated.length) h+=`<p class="mini">${esc(s.irritated.join(", "))} flagged — kept away from failure.</p>`;

    let wi=0;
    for(const d of all){
      const isW=!!d.warmup; if(!isW) wi++;
      h+=`<button class="setline" data-act="editset" data-id="${d._id}" style="width:100%;border:0;background:none;text-align:left;cursor:pointer">
        <span class="ix">${isW?"·":wi}</span>
        <span class="lg"${isW?' style="opacity:.55"':""}>${esc(fmtL(e,d.load))} × ${d.reps}</span>
        ${isW?`<span class="tag">warm-up</span>`:""}
        ${d.rir!=null?`<span class="tag">${d.rir} left</span>`:""}
        ${d.endpoint==="FAILED_CONCENTRIC"?`<span class="tag">failure</span>`:""}
        ${d.calibration?`<span class="tag">calibration</span>`:""}
        <span class="grow"></span><span class="mini">edit</span></button>`;
    }

    if(!complete){
      const setIx=done.length+1, isLast=setIx>=s.sets;
      const cur = done.length?done[done.length-1].load : s.load;
      const pm = plateMath(e, cur);
      h+=`<div class="rule"></div>
      <div class="row" style="margin-bottom:8px">
        <select data-load="${s.ex}" style="flex:1">${
          s.needsSeed && !done.length
          ? `<option value="">Pick a weight you could do about 15 times</option>`+s.loadSet.map(v=>`<option value="${v}">${esc(fmtL(e,v))}</option>`).join("")
          : s.loadSet.map(v=>`<option value="${v}" ${Math.abs(v-(cur||0))<1e-6?"selected":""}>${esc(fmtL(e,v))}</option>`).join("")
        }</select>
        ${Rest.ex===s.ex && Rest.left()>0 ? `<span class="pill" id="resttimer">Rest</span>` : ""}
      </div>
      ${pm?`<p class="mini" style="margin:-2px 0 8px">${esc(pm)}</p>`:""}
      <div class="row" style="margin-bottom:8px">
        <button class="step" data-act="rep-" data-ex="${s.ex}">−</button>
        <button class="btn primary big grow" data-act="logset" data-ex="${s.ex}" data-set="${setIx}" data-last="${isLast?1:0}" data-calib="${isLast&&s.calibration?1:0}">
          Log <span data-reps="${s.ex}">${s.needsSeed&&!done.length?8:s.reps}</span> reps</button>
        <button class="step" data-act="rep+" data-ex="${s.ex}">+</button>
      </div>
      <div class="chips">
        <button class="chip sm" data-act="warmup" data-ex="${s.ex}">Warm-up</button>
        <button class="chip sm" data-act="busy" data-ex="${s.ex}" data-m="${s.muscle}">It's taken</button>
        <button class="chip sm" data-act="addset" data-ex="${s.ex}" data-n="${s.sets+1}">+ set</button>
      </div>
      ${isLast&&s.calibration?`<p class="why">Calibration set: stop where you normally would, tap how many you had left, then keep going to a rep you can't finish and tell me how many extra you got.</p>`:""}
      ${s.needsSeed&&!done.length?`<p class="why">First time on this one — pick a weight you'd get about 15 times, then do 8. I'll work the rest out.</p>`:""}
      ${s.romSensitive&&s.romCue&&s.needsSeed&&!done.length?`<p class="mini">${esc(s.romCue)}</p>`:""}`;
    } else {
      h+=`<div class="rule"></div><button class="btn wide" data-act="addset" data-ex="${s.ex}" data-n="${s.sets+1}">Another set</button>`;
    }
    h+=`</div>`;
  }


  h += coachCard(p);
  h += `<div class="dock"><button class="btn primary wide big" data-act="endsession">Finish session</button></div>`;
  $("#v-session").innerHTML=h;
}

function sessionLine(p){
  const bits=[];
  bits.push(`${p.minutes} min`);
  if(p.ramping) bits.push("ramp-in: lighter on purpose");
  else if(S.settings.phase==="CUT") bits.push("holding volume while you cut");
  return bits.join(" · ");
}
function nextTrainingDay(date){
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  for(let i=1;i<=7;i++){ const d=addDays(date,i); if(S.settings.days.includes(dow(d))) return days[dow(d)]; }
  return null;
}
/* Everything the planner decided, in plain sentences, folded away. The rule
   ids are in there for when you distrust a number — not on the face of it. */
function coachCard(p){
  const adv = phaseAdvice();
  /* Only what changed RECENTLY. The card used to re-print the same four
     paragraphs every day, which is how a screen stops being read at all. */
  const cutoff = addDays(todayISO(), -8);
  const recent = S.diffs.filter(g=>String(g.date) >= cutoff).slice(-3).reverse().flatMap(g=>g.list);
  const notes = (p.notes||[]);
  if(!adv.length && !recent.length && !notes.length) return "";
  // Anything that visibly reshaped today is stated plainly; the rest folds away.
  const LOUD = new Set(["SAF-05","CAP-01","MIS-01","OVERCONSTRAINED","PRG-10","SAF-SCREEN"]);
  const loud = notes.filter(n=>LOUD.has(n.rule));
  const quiet = notes.filter(n=>!LOUD.has(n.rule));
  if(!loud.length && !adv.length && !recent.length) return "";
  let h=`<div class="card"><h3>Why it looks like this</h3>`;
  for(const n of loud) h+=`<p class="why">${esc(n.text)}</p>`;
  for(const a of adv){
    h+=`<p class="why">${esc(a.text)}`;
    if(a.more) h+=` <a href="#" data-act="expandnote" data-r="${esc(a.rule)}">why</a>`;
    if(a.dismissable) h+=` <a href="#" data-act="hidenote" data-r="${esc(a.rule)}">hide</a>`;
    h+=`</p>`;
    if(a.more && EXPANDED.has(a.rule)) h+=`<p class="mini" style="margin:-4px 0 8px 13px">${esc(a.more)}</p>`;
  }
  for(const d of recent.slice(0,4)) h+=`<p class="why">${esc(d.sentence)}</p>`;
  if(quiet.length || recent.length>4){
    h+=`<details style="margin-top:6px"><summary class="mini">Everything, with rule ids</summary>`;
    for(const n of quiet) h+=`<p class="why"><b>${esc(n.rule)}</b> ${esc(n.text)}</p>`;
    for(const d of recent) h+=`<p class="why"><b>${esc(d.rule)}</b> ${esc(d.sentence)}</p>`;
    h+=`</details>`;
  }
  return h+`</div>`;
}


/* --------------------------- PROGRESS -----------------------------
   Everything that answers "is this working?", in one place. Strength first,
   because it is the only signal that moves fast enough to read weekly.
   Body numbers are further down on purpose and never on the home screen.
   ------------------------------------------------------------------ */
const LADDER_LABEL = { RAMP:"easing in", BUILD:"adding", HOLD:"steady",
  PROBE:"testing fewer", DELOAD:"recovering", MAINTAIN:"holding" };
function renderLog(){
  let h=syncBanner();
  const exIds=[...new Set(S.events.filter(e=>e.type==="set" && !S.voided.has(e.id)).map(e=>e.payload.ex))];

  if(exIds.length){
    h+=`<div class="card"><h3>Working weights</h3>
  
      <div class="scroll-x"><table>
      <tr><th>Lift</th><th style="text-align:right">Load</th><th style="text-align:right">Reps</th><th style="text-align:right">Sessions</th></tr>`;
    for(const id of exIds){ const e=LIBX[id], es=S.ex[id]; if(!e||!es) continue;
      h+=`<tr><td>${esc(e.name)}</td><td class="n">${esc(fmtL(e,es.load))}</td>
      <td class="n">${es.target}</td><td class="n">${es.sessions}</td></tr>`; }
    h+=`</table></div></div>`;
  } else {
    h+=`<div class="empty">Log a session and this fills up.</div>`;
  }

  h+=`<div class="card"><h3>This week</h3>
    <p class="mini">Done against planned. A lift hitting two muscles counts whole for the main one, half for the other.</p>`;
  for(const m of MUSCLES){ const ms=S.mus[m];
    if(NO_DIRECT.has(m) && !ms.fsWeek) continue;
    if(!ms.fsWeek && !ms.target) continue;
    const w=Math.min(100, 100*ms.fsWeek/Math.max(1,ms.target));
    h+=`<div class="setline"><span class="grow">${MUSCLE_LABEL[m]}
      <div style="height:6px;background:var(--sunken);border-radius:3px;margin-top:4px">
      <div style="height:6px;width:${w}%;background:var(--accent);border-radius:3px"></div></div></span>
      <span class="lg">${r1(ms.fsWeek)}/${r1(ms.target)}</span>
      <span class="tag">${esc(LADDER_LABEL[ms.ladder]||ms.ladder)}</span></div>`;
  }
  h+=`</div>`;

  if(S.restricted){
    h+=`<div class="card"><h3>Body numbers hidden</h3>
      <p class="sub">They'll come back when the frequency cap lifts.</p></div>`;
  } else {
    const t=bwTrend();
    h+=`<div class="card"><h3>Morning weight</h3>
      <div class="row"><input type="number" step="0.1" inputmode="decimal" id="bwin" placeholder="${u()}">
      <button class="btn primary" data-act="logbw">Log</button></div>`;
    if(t){
      h+=`<div class="row" style="margin-top:12px"><div class="grow">
        <div class="bigload">${esc(fmtLoad(t.ew))}<small>trend</small></div>
        <div class="mini">last reading ${esc(fmtLoad(t.last))} · ${t.n} logged</div></div></div>`;
      if(t.pctWk!=null) h+=`<p class="why"><b>${(t.pctWk*100>=0?"+":"")}${(t.pctWk*100).toFixed(2)}% a week.</b> ${
        S.settings.phase==="CUT"
          ? (t.pctWk<K.CUT_RATE[0]?"Faster than 0.5–0.8% a week, which is where lean mass starts going with it."
            : t.pctWk>K.CUT_RATE[1]?"Slower than the 0.5–0.8% band."
            : "Inside the 0.5–0.8% band.")
          : "Over the last 21 days."}</p>`;
      if(!t.enough) h+=`<p class="why"><b>${t.readings14} of 8 readings</b> in the last fortnight. Below eight I won't change anything off bodyweight — acting on three noisy readings is worse than not acting.</p>`;
    }
    h+=`</div>`;

    const w=waistStats();
    h+=`<div class="card"><details><summary><b>Waist</b>${w&&w.median28!=null?` — ${r1(w.median28)} cm`:""}</summary>
      <p class="mini" style="margin-top:8px">Mean of three, same site, same time of day. Optional — but it is the only measurement here that moves fast enough to mean anything.</p>
      <div class="row"><input type="number" step="0.1" inputmode="decimal" id="w1" placeholder="1">
        <input type="number" step="0.1" inputmode="decimal" id="w2" placeholder="2">
        <input type="number" step="0.1" inputmode="decimal" id="w3" placeholder="3">
        <button class="btn primary" data-act="logwaist">Log</button></div>`;
    if(w && w.median28!=null && w.min90!=null){
      const d=w.median28-w.min90;
      h+= Math.abs(d) < K.WAIST_MDC_CM
        ? `<p class="why"><b>No real change.</b> Within ${K.WAIST_MDC_CM} cm of your 90-day low, which is the smallest gap a tape can resolve.</p>`
        : `<p class="why"><b>${d>0?"+":""}${r1(d)} cm</b> against your 90-day low.</p>`;
    }
    h+=`</details></div>`;

    const photoBytes = S.photos.reduce((a,p)=>a+(p.bytes||0),0);
    h+=`<div class="card"><details><summary><b>Photos</b>${S.photos.length?` — ${S.photos.length}, ${photoBytes>1048576?(photoBytes/1048576).toFixed(1)+" MB":Math.round(photoBytes/1024)+" KB"} total`:""}</summary>
      <p class="mini" style="margin-top:8px">Compressed to about 150 KB and encrypted on this device before anything is uploaded. Same pose, same light, same time of day.</p>`;
    if(!Photo.key) h+=`<div class="row"><input type="password" id="pp" placeholder="Photo passphrase">
      <button class="btn" data-act="unlockphotos">Unlock</button></div>
      <p class="mini" style="margin-top:8px">Keep this in your password manager. Lose it and the photos are gone — the training log is deliberately not encrypted so that can never happen to your actual data.</p>`;
    else h+=`<button class="btn wide" data-act="addphoto">Add today's photo</button>
      <div class="ph" id="phgrid" style="margin-top:10px"></div>`;
    h+=`</details></div>`;
  }

  const all=S.diffs.slice().reverse().flatMap(g=>g.list.map(d=>({...d,date:g.date})));
  h+=`<div class="card"><details><summary><b>Every decision it has made</b>${all.length?` — ${all.length}`:""}</summary>
    <p class="mini" style="margin-top:8px">Nothing can change without a sentence here. A change with no reason attached throws rather than shipping quietly.</p>`;
  if(!all.length) h+=`<p class="sub">Nothing yet.</p>`;
  for(const d of all.slice(0,60)) h+=`<p class="why"><b>${esc(d.date)}</b> ${esc(d.sentence)} <span class="mini">${esc(d.rule)}</span></p>`;
  h+=`<p class="mini" style="margin-top:10px">Reviewed every 12 weeks, not weekly: eight weeks of direct shoulder work buys about a millimetre, and a tape can't resolve less than ${K.WAIST_MDC_CM} cm. A weekly number would be noise, and noise you check daily starts to feel like failure.</p>`;
  h+=`</details></div>`;

  h += dataCard();
  $("#v-log").innerHTML=h;
  if(Photo.key) paintPhotos();
}


async function paintPhotos(){
  const g=$("#phgrid"); if(!g) return;
  const rows=[...S.photos].sort((a,b)=>a.d<b.d?1:-1).slice(0,12);
  g.innerHTML = rows.map(r=>`<div><img data-pid="${esc(r.id)}" alt="${esc(r.d)}"><div class="mini">${esc(r.d)}</div></div>`).join("")
    || `<div class="empty">No photos yet.</div>`;
  for(const r of rows){
    try{
      const rec = await tx("photos","readonly",s=>s.get(r.id));
      if(!rec) continue;
      const plain = await Photo.decrypt(new Uint8Array(rec.blob), r.id, r.d);
      const img = g.querySelector(`img[data-pid="${CSS.escape(r.id)}"]`);
      if(img) img.src = URL.createObjectURL(new Blob([plain],{type:"image/jpeg"}));
    }catch(e){}
  }
}

  /* --- what you're eating for ------------------------------------------ */

    ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>`<button class="chip" aria-pressed="${st.days.includes(i)}" data-act="day" data-d="${i}" style="flex:1;padding:0 8px">${d}</button>`).join("")}</div>
    <div class="grid2">

    </div>
    <button class="btn wide" data-act="savesched">Save</button>
    <p class="mini" style="margin-top:6px">Protein floor ${Math.round(st.bodyKg*K.PROTEIN_G_PER_KG)} g a day.</p>
    <label class="row" style="margin-top:10px"><input type="checkbox" style="width:auto" ${st.unlockHighVolume?"checked":""} data-act="unlockvol">
      <span class="sub">Let a muscle go past 20 sets a week</span></label></div>`;

  /* --- where you train -------------------------------------------------- */
  h+=`<div class="card"><details><summary><b>My gym — ${esc(g.name)}</b></summary>
    <p class="mini" style="margin-top:8px">Only worth touching if you change gyms.</p>
    <div class="grid2">
      <label class="fld"><span>Units</span><select id="unit">${["lb","kg"].map(x=>`<option ${g.unit===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="fld"><span>Bar weight</span><input type="number" id="bar" step="0.5" value="${r1(fromKg(g.barKg,g.unit))}"></label>
      <label class="fld"><span>Dumbbells min</span><input type="number" id="dbmin" value="${g.dbSegments[0].lo}"></label>
      <label class="fld"><span>Dumbbells max</span><input type="number" id="dbmax" value="${g.dbSegments[g.dbSegments.length-1].hi}"></label>

/* Backup and the honesty block live with the DATA, not with the person.
   Settings is for facts about him that change; these are neither. */
function dataCard(){
  const st=S.settings;
  let h=`<div class="card"><details ${Sync.configured()?"":"open"}><summary><b>Backup</b> — ${Sync.configured()?esc(Sync.state):"not connected"}</summary>
    <p class="mini" style="margin-top:8px">Plain text in a private GitHub repo, one file per training day. <code>git clone</code> gets it all back with no app.</p>
    <label class="fld"><span>Private data repo</span><input type="text" id="repo" placeholder="meni-gottesman/overload-data" value="${esc(st.repo||"")}"></label>
    <label class="fld"><span>Token — Contents: read and write, that repo only</span>
      <input type="password" id="tok" placeholder="${Sync.token?"•••••••• stored on this device":"github_pat_..."}"></label>
    <button class="btn primary wide" data-act="savesync">Connect</button>
    <p class="mini" style="margin-top:8px">${esc(Sync.state)}${Sync.lastOk?` · last upload ${new Date(Sync.lastOk).toLocaleString()}`:""}${Sync.pending.length?` · ${Sync.pending.length} waiting`:""}${Sync.lastErr?` · ${esc(Sync.lastErr)}`:""}</p>
    <div class="row" style="margin-top:8px">
      <button class="btn grow" data-act="syncnow">Back up now</button>
      <button class="btn grow" data-act="export">Export to a file</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn grow" data-act="import">Import a file</button>
      <button class="btn grow" data-act="restore">Restore from GitHub</button>
    </div>
    <p class="mini" style="margin-top:6px">Restore merges the repo back in. Nothing local is deleted.</p>
    </details></div>`;

  h+=`<div class="card"><details><summary><b>What these numbers are, and what they aren't</b></summary><div style="margin-top:8px">
    <p class="sub">The training weights come from a small literature on what strangers rate as attractive in photographs and CGI models of men's bodies. That isn't the same as what happens between two people. Where researchers measured actual outcomes instead of ratings, the association is about <b>r = 0.08 to 0.13</b> — half a percent to two percent of the variation. Real, small, and correlational: nobody has ever measured the same man before and after a training block and rated him twice.</p>
    <p class="sub"><b>The per-muscle weights are the weakest part of this app.</b> One study has ever asked women about individual muscle groups. Thirteen of its fourteen muscles sit inside a one-point band on a seven-point scale, while raters disagreed with each other by more than that whole band. So this ships four tiers, not sixteen numbers. Where you see 2.0 beside 1.25, that gap is a judgment about recovery cost — not a measured preference.</p>
    <p class="sub"><b>Body fat is an estimate.</b> Whatever your scale says, the truth is probably within three to five points of it, so nothing here triggers off a body-fat percentage. Everything triggers off waist and scale weight.</p>
    <p class="sub"><b>The body is one input.</b> This research removes faces by design, so nobody has measured what share physique carries. Height, face and voice all appear in it and none are things a training plan touches.</p>
    <p class="sub"><b>Always on, and not switchable:</b> no body numbers on the home screen, a hard stop after 12 straight weeks in a deficit, a 0.8%-a-week rate cap, no physique imagery, no streaks, 12-week reviews.</p>
    <div class="rule"></div>
    <p class="why"><b>Engineering guesses, labelled as such:</b> the 9-sets-per-session cap (absent from the peer-reviewed literature), the 14- and 28-day layoff bands (no trial), the 2–10% load steps (committee consensus), the two fatigue priors, and the 2.5 cm waist tripwire (calibrated to tape noise).</p>
    <p class="why"><b>Deleted as unverifiable:</b> a 13–14% body-fat optimum, a 1.57 shoulder-to-waist plateau, a 0.77 waist-to-chest target, "1.15 cm of waist per kg". None survived source-checking; none are in the code.</p>
    </div></details></div>`;
  return h;
}


/* ========================= SHEETS / PROMPTS ======================== */
function sheet(html){
  /* The overlay styling lives on .sheet. Clearing className removed "hide" but
     never added "sheet", so every prompt rendered as unstyled text at the
     bottom of the document instead of over it — the RIR question on the last
     set of every exercise appeared below the fold and looked like nothing
     happened. */
  const s=$("#sheet"); s.className="sheet"; s.innerHTML=`<div class="inner">${html}</div>`;
  s.scrollIntoView && s.scrollIntoView({block:"nearest"});
}
/* No alert()/confirm() anywhere: a native modal on a phone blocks the whole
   page, and in a gym it is the difference between logging a set and losing it. */
function toast(msg, kind){
  const m=document.querySelector("main");
  const el=document.createElement("div");
  el.className="banner "+(kind||"warn"); el.textContent=msg;
  m.insertBefore(el, m.firstChild);
  setTimeout(()=>el.remove(), 7000);
}
let CONFIRM_CB=null;
function confirmSheet(title, body, yes){
  return new Promise(res=>{
    CONFIRM_CB=res;
    sheet(`<h3>${esc(title)}</h3><p class="sub">${esc(body)}</p>
      <div class="stack" style="margin-top:14px">
        <button class="btn primary wide" data-act="confirm-yes">${esc(yes)}</button>
        <button class="btn wide" data-act="confirm-no">Cancel</button></div>`);
  });
}
function closeSheet(){ const s=$("#sheet"); s.className="hide"; s.innerHTML=""; }
let RIR_CB=null, END_CB=null, EXTRA_CB=null;
function askExtra(cb){
  EXTRA_CB=cb;
  sheet(`<h3>Now you've gone to failure — how many extra reps did you get?</h3>
    <p class="sub">Past the point where you'd normally have stopped.</p>
    <div class="chips" style="margin-top:12px">${[0,1,2,3,4,5,6].map(v=>`<button class="chip" data-act="extra" data-v="${v}" style="flex:1">${v}</button>`).join("")}</div>`);
}
function askRIR(cb){
  RIR_CB=cb;
  sheet(`<h3>How many more reps could you have done with good form?</h3>
    <div class="chips" style="margin-top:12px">
      ${[0,1,2,3].map(v=>`<button class="chip" data-act="rir" data-v="${v}" style="flex:1">${v===3?"3+":v}</button>`).join("")}
    </div><button class="btn wide" data-act="rir" data-v="" style="margin-top:12px">Skip</button>`);
}
function askEndpoint(cb){
  END_CB=cb;
  sheet(`<h3>Which was it?</h3><div class="stack" style="margin-top:12px">
    <button class="btn wide" data-act="endp" data-v="FAILED_CONCENTRIC">Tried another rep, couldn't finish it</button>
    <button class="btn wide" data-act="endp" data-v="STOPPED_TECHNICAL">Form broke — stopped on the rep before</button>
    <button class="btn wide" data-act="endp" data-v="STOPPED_AT_RIR">Stopped short</button></div>`);
}

/* ============================ ACTIONS ============================== */
const REPBUF={};
document.addEventListener("click", async (ev)=>{
  const t=ev.target.closest("[data-act],[data-v]"); if(!t) return;
  const a=t.dataset.act;
  try{ await handle(a,t,ev); }catch(err){ console.error(err); toast("Something went wrong: "+(err.message||err), "bad"); }
});
document.addEventListener("click", (ev)=>{
  const b=ev.target.closest("#tabs button"); if(b) go(b.dataset.v);
});

async function handle(a,t,ev){
  const st=S.settings;
  switch(a){
  /* ---- session ---- */
  case "expandnote": ev.preventDefault();
    EXPANDED.has(t.dataset.r) ? EXPANDED.delete(t.dataset.r) : EXPANDED.add(t.dataset.r);
    return render();
  case "unhide": await append("settings",{dismissed:[]}); rebuild(); render();
    return toast("Back on the Today screen.", "ok");
  case "hidenote": {
    ev.preventDefault();
    const list=[...((S.settings.dismissed)||[]), t.dataset.r];
    await append("settings",{dismissed:[...new Set(list)]});
    rebuild(); render(); return toast("Hidden. It's still in Settings if you want it back.", "ok");
  }
  case "openex": OPEN_EX = (OPEN_EX===t.dataset.ex) ? null : t.dataset.ex; return render();
  case "busy": {
    const exId=t.dataset.ex, m=t.dataset.m;
    const plan=ensurePlan(todayISO());
    const alts=alternativesFor(exId, m, plan.slots.map(x=>x.ex));
    const others=plan.slots.filter(x=>x.ex!==exId).length;
    /* Two genuinely different answers to "someone's on it", and conflating
       them was the gap. Later = same lift, same history, just not now.
       Swap = a different lift, and the original's progress is still kept. */
    sheet(`<h3>${esc((LIBX[exId]||{}).name||"")} is taken</h3>
      <p class="sub">Don't wait. Either come back to it or do something else that trains the same muscle.</p>
      ${others?`<button class="btn primary wide big" data-act="defer" data-ex="${exId}" style="margin-top:12px">Do it later — move it down</button>`:""}
      ${alts.length?`<p class="mini" style="margin-top:14px">Or swap it for good today:</p>
        <div class="stack">${alts.map(e=>`<button class="btn wide" data-act="swapto" data-from="${exId}" data-to="${e.id}">${esc(e.name)}</button>`).join("")}</div>`
        : `<p class="mini" style="margin-top:12px">Nothing else here trains that muscle without doubling up a movement you're already doing.</p>`}
      <p class="mini" style="margin-top:12px">Either way your history on ${esc((LIBX[exId]||{}).name||"it")} is kept — neither of these resets anything.</p>`);
    return;
  }
  case "defer": {
    await ensureStarted();
    await append("planEdit",{d:todayISO(), op:"defer", ex:t.dataset.ex});
    closeSheet(); rebuild();
    const p2=ensurePlan(todayISO());
    const cnt = ex => S.events.filter(e=>e.type==="set" && !S.voided.has(e.id)
      && e.payload.d===todayISO() && e.payload.ex===ex && !e.payload.warmup).length;
    const next=p2.slots.find(x=>cnt(x.ex) < x.sets);
    OPEN_EX = next?next.ex:null;
    render();
    return toast(next?`Moved down. Do ${LIBX[next.ex]?LIBX[next.ex].name.toLowerCase():"the next one"} instead.`:"Moved to the end.", "ok");
  }
  case "swapto": {
    await ensureStarted();
    await append("planEdit",{d:todayISO(), op:"swap", from:t.dataset.from, to:t.dataset.to, reason:"equipment"});
    OPEN_EX = t.dataset.to;
    closeSheet(); rebuild(); return render();
  }
  case "addset": {
    await ensureStarted();
    await append("planEdit",{d:todayISO(), op:"sets", ex:t.dataset.ex, sets:+t.dataset.n});
    rebuild(); return render();
  }
  case "timecut": {
    sheet(`<h3>How long have you got?</h3>
      <p class="sub">Index lifts and the heavy compound for each priority muscle are protected — what gets cut is accessory work, from the back.</p>
      <div class="chips" style="margin-top:12px">
        ${[30,45,60,90].map(v=>`<button class="chip" data-act="timeset" data-v="${v}" style="flex:1">${v} min</button>`).join("")}</div>`);
    return;
  }
  case "timeset": {
    const mins=+t.dataset.v, d=todayISO();
    const before=ensurePlan(d).minutes;
    if(before<=mins){ closeSheet();
      return toast(`Today is already about ${before} minutes — nothing to cut.`, "ok"); }
    await ensureStarted();
    await append("planEdit",{d, op:"time", minutes:mins});
    closeSheet(); rebuild();
    const after=ensurePlan(d);
    // The response to a deliberate tap has to be visible, not filed away in a
    // disclosure the user has to go looking for.
    const note=(after.notes||[]).filter(n=>n.rule==="CAP-01").slice(-1)[0];
    render();
    if(note) toast(note.text, after.minutes>mins ? "warn" : "ok");
    return;
  }
  case "trainanyway": {
    await append("settings",{days:[...new Set(S.settings.days.concat(dow(todayISO())))].sort()});
    rebuild(); return render();
  }
  case "editset": {
    const id=+t.dataset.id;
    const ev=S.events.find(x=>x.id===id); if(!ev) return;
    const e=LIBX[ev.payload.ex];
    sheet(`<h3>${esc(e?e.name:"Set")}</h3>
      <p class="sub">${esc(fmtL(e,ev.payload.load))} × ${ev.payload.reps}${ev.payload.warmup?" (warm-up)":""}</p>
      <label class="fld" style="margin-top:12px"><span>Reps actually done</span>
        <input type="number" id="ereps" value="${ev.payload.reps}"></label>
      <button class="btn primary wide" data-act="saveset" data-id="${id}">Save</button>
      <button class="btn wide danger" data-act="voidset" data-id="${id}" style="margin-top:8px">Remove this set</button>
      <p class="mini" style="margin-top:10px">Nothing is erased — a correction is recorded on top, so the history stays honest.</p>`);
    return;
  }
  case "saveset": {
    const id=+t.dataset.id, ev=S.events.find(x=>x.id===id); if(!ev) return;
    const reps=+$("#ereps").value;
    await append("voidSet",{id});
    await append("set", Object.assign({}, ev.payload, {reps, corrected:true}));
    closeSheet(); rebuild(); return render();
  }
  case "voidset": {
    await append("voidSet",{id:+t.dataset.id});
    closeSheet(); rebuild(); return render();
  }
  case "rep+": case "rep-": {
    const id=t.dataset.ex, span=document.querySelector(`[data-reps="${CSS.escape(id)}"]`);
    let v=+span.textContent + (a==="rep+"?1:-1); v=Math.max(0,v);
    span.textContent=v; REPBUF[id]=v; return;
  }
  case "logset": {
    const id=t.dataset.ex, isLast=t.dataset.last==="1";
    const sel=document.querySelector(`[data-load="${CSS.escape(id)}"]`);
    if(sel && sel.value==="") return toast("Pick the weight first.");
    const load=+sel.value;
    const reps=+document.querySelector(`[data-reps="${CSS.escape(id)}"]`).textContent;
    const commit=async(rir,endpoint,extra)=>{
      await commitSet(id, load, reps, rir, endpoint, extra); closeSheet();
      Rest.start(id, (LIBX[id]||{}).rest || 120);
      advanceIfComplete(id); render();
    };
    const isCalib = t.dataset.calib==="1";
    if(!isLast) return commit(null,null);
    return askRIR(async(rir)=>{
      if(isCalib) return askExtra(async(extra)=>commit(rir, "FAILED_CONCENTRIC", extra));
      if(rir===0) return askEndpoint(async(e)=>commit(0,e));
      return commit(rir, rir==null?null:"STOPPED_AT_RIR");
    });
  }
  case "rir": { const v=t.dataset.v; const cb=RIR_CB; RIR_CB=null; closeSheet(); return cb(v===""?null:+v); }
  case "extra": { const cb=EXTRA_CB; EXTRA_CB=null; closeSheet(); return cb(+t.dataset.v); }
  case "warmup": {
    const id=t.dataset.ex, sel=document.querySelector(`[data-load="${CSS.escape(id)}"]`);
    if(!sel || sel.value==="") return toast("Pick the weight first.");
    await ensureStarted();
    // §5.7: never render an input control that cannot represent what actually
    // happened. Warm-ups are excluded from every ledger and from progression,
    // but refusing to record them would just push them into the working sets.
    await append("set",{ d:todayISO(), ex:id, load:+sel.value,
      reps:+document.querySelector(`[data-reps="${CSS.escape(id)}"]`).textContent,
      rir:null, endpoint:null, warmup:true, rom:1, assisted:0, calibration:false,
      priorHard:0, hoursSince:999, pos:1 });
    Rest.start(id, 60); render(); return;
  }
  case "rpe": {
    await append("sessionEnd",{d:todayISO(), rpe:t.dataset.v===""?null:+t.dataset.v});
    closeSheet(); Rest.clear(); Sync.flush(); rebuild(); return go("session");
  }
  case "endp": { const cb=END_CB; END_CB=null; closeSheet(); return cb(t.dataset.v); }
  case "endsession": {
    sheet(`<h3>How hard was that session overall?</h3>
      <p class="sub">One tap, or skip it. This is recorded, not acted on — nothing in the planner reads it yet.</p>
      <div class="chips" style="margin-top:12px">${[2,4,6,8,10].map(v=>`<button class="chip" data-act="rpe" data-v="${v}" style="flex:1">${v}</button>`).join("")}</div>
      <button class="btn wide" data-act="rpe" data-v="" style="margin-top:10px">Skip</button>`);
    return;
  }
  /* ---- body ---- */
  case "logbw": { const v=+$("#bwin").value; if(!v) return;
    await append("weight",{d:todayISO(), kg:toKg(v,u())}); rebuild(); return render(); }
  case "savenote": {
    const text=($("#notein").value||"").trim();
    if(!text) return;
    await append("note",{d:todayISO(), text});
    const scan=scanNote(text);
    rebuild(); render();
    /* Never act on parsed text silently. The scan is a suggestion; the tap is
       the decision. Red flags take precedence over everything. */
    if(scan.red.length){
      sheet(`<h3>That needs a person, not an app</h3>
        <p class="sub">You mentioned something this app is not able to assess. If any of it is happening now, stop training and speak to a clinician.</p>
        <ul class="sub">${RED_FLAGS.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        <button class="btn wide danger" data-act="redflag-yes" style="margin-top:12px">One of these is happening</button>
        <button class="btn wide" data-act="closesheet" style="margin-top:8px">Not one of those — just noted it</button>`);
      return;
    }
    if(scan.joints.length){
      const j=scan.joints[0];
      sheet(`<h3>Want me to work around your ${esc(j.replace("_"," "))}?</h3>
        <p class="sub">How bad is it, 0 to 10? Anything from 6 up and I'll pull exercises that load it out of your sessions entirely — the muscle still gets trained, through a different door. It fades by a point a day.</p>
        <div class="chips" style="margin-top:12px">${[2,4,6,8,10].map(v=>`<button class="chip" data-act="irrset" data-j="${j}" data-v="${v}" style="flex:1">${v}</button>`).join("")}</div>
        <button class="btn wide" data-act="closesheet" style="margin-top:10px">Leave it — just a note</button>
        <p class="mini" style="margin-top:10px">Pain that is sharp, catching, or still there next morning is worth a clinician rather than a change of exercise.</p>`);
      return;
    }
    return toast("Noted.", "ok");
  }
  case "screentoggle":
    await append("settings",{screening: t.checked?"LIGHT_MODERATE_ONLY":"CLEAR"});
    rebuild(); return render();
  case "logwaist": {
    const v=[+$("#w1").value, +$("#w2").value, +$("#w3").value].filter(x=>x>0);
    if(v.length<3) return toast("All three measures — a single reading is noise.");
    const cm = v.reduce((a,b)=>a+b,0)/3;
    await append("waist",{d:todayISO(), cm:Math.round(cm*10)/10, site:"umbilical"});
    rebuild(); return render();
  }
  case "unlockphotos": { const p=$("#pp").value; if(!p) return;
    await Photo.unlock(p); if(Sync.configured()) try{ await Sync.putFile("photos/DECRYPT.md", DECRYPT_MD, "how to decrypt without this app"); }catch(e){}
    return render(); }
  case "addphoto": {
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
      const d=todayISO(), id="p"+Date.now();
      let small;
      try{ small=await Photo.downscale(f); }
      catch(err){ return toast("Couldn't compress that photo: "+(err.message||err), "bad"); }
      const enc=await Photo.encrypt(small.bytes, id, d);
      await tx("photos","readwrite",s=>s.put({id, blob:enc.buffer}));
      await append("photo",{id,d,bytes:small.size,original:small.original});
      if(Sync.configured()) try{ await Sync.putFile(`photos/${d.slice(0,4)}/${d}-${id}.jpg.enc`, enc, "photo "+d); }catch(e){}
      rebuild(); render();
      toast(`Saved · ${Math.round(small.size/1024)} KB, down from ${(small.original/1048576).toFixed(1)} MB.`, "ok"); };
    return inp.click();
  }
  /* ---- setup ---- */
  case "savesync": {
    const repo=$("#repo").value.trim(), tok=$("#tok").value.trim();
    if(repo.includes("/")){ const [o,r]=repo.split("/"); Sync.owner=o; Sync.repo=r;
      await kvPut("gh_repo",{owner:o,repo:r}); await append("settings",{repo}); }
    if(tok){ Sync.token=tok; await kvPut("gh_token",tok); await append("settings",{tokenSet:true}); }
    Sync.state="idle";
    /* The photo salt was pushed only at the moment it was generated, and only
       if sync happened to be configured already. Unlock photos before
       connecting GitHub and every encrypted photo in the repo became
       permanently undecryptable. Push it whenever we connect. */
    if(Sync.configured()){
      const salt = await kvGet("photo_salt");
      if(salt) try{ await Sync.putFile("photos/salt.b64", b64enc(salt instanceof Uint8Array?salt:new Uint8Array(salt)), "photo salt"); }catch(e){}
      try{ await Sync.putFile("photos/DECRYPT.md", DECRYPT_MD, "how to decrypt without this app"); }catch(e){}
    }
    for(const e of S.events) if(!Sync.pending.find(p=>p.id===e.id)) Sync.pending.push(e);
    await Sync.flush(); rebuild(); return render();
  }
  case "syncnow": for(const e of S.events) if(!Sync.pending.find(p=>p.id===e.id)) Sync.pending.push(e);
    await Sync.flush(); return render();
  case "restore": {
    if(!Sync.configured()) return toast("Connect the repo first.");
    toast("Reading the repo…");
    try{
      const remote = await Sync.pullAll();
      const have = new Set(S.events.map(e=>e.id));
      let n=0;
      for(const ev of remote){
        if(!ev || ev.id==null || have.has(ev.id)) continue;
        await tx("events","readwrite",st=>st.put(ev)); have.add(ev.id); n++;
      }
      S.events = await allEvents();
      S.events.sort((a,b)=>(a.id||0)-(b.id||0));
      rebuild(); render();
      toast(n?`Restored ${n} entries from GitHub. Nothing local was replaced.`:"Nothing new in the repo — you're already up to date.", "ok");
    }catch(e){ toast("Restore failed: "+(e.message||e), "bad"); }
    return;
  }
  case "export": return doExport();
  case "import": {
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".txt,.json,text/plain,application/json";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
      const txt=await f.text(); const data=JSON.parse(txt);
      const have=new Set(S.events.map(e=>e.id));
      let n=0;
      for(const e of (data.events||[])) if(!have.has(e.id)){ await tx("events","readwrite",s=>s.put(e)); n++; }
      S.events=await allEvents(); rebuild(); render(); toast(`Merged ${n} new entries. Nothing was replaced.`, "ok"); };
    return inp.click();
  }
  case "phase": await append("settings",{phase:t.dataset.p}); rebuild(); return render();
  case "screen": await append("settings",{screening:t.dataset.v}); rebuild(); return render();
  case "day": { const d=+t.dataset.d;
    const days = st.days.includes(d)?st.days.filter(x=>x!==d):st.days.concat(d).sort();
    await append("settings",{days}); rebuild(); return render(); }
  case "savesched": {
    const patch={minutes:+$("#mins").value};
    const bw=+($("#bwset")||{value:0}).value;
    if(bw>0) patch.bodyKg = toKg(bw, u());
    await append("settings",patch); rebuild(); render();
    return toast("Saved.", "ok");
  }
  case "savegym": {
    const un=$("#unit").value, mp=+$("#minplate").value;
    const gym=Object.assign({}, st.gym, { unit:un, barKg:toKg(+$("#bar").value,un),
      plates:[{w:45,pairs:8},{w:35,pairs:2},{w:25,pairs:2},{w:10,pairs:4},{w:5,pairs:4},{w:mp,pairs:2}]
        .filter((p,i,arr)=>arr.findIndex(q=>q.w===p.w)===i).sort((x,y)=>y.w-x.w),
      dbSegments:[{lo:+$("#dbmin").value,hi:+$("#dbmax").value,step:+$("#dbstep").value}],
      stackStep:+$("#stack").value });
    await append("settings",{gym, unit:un}); rebuild(); return render();
  }
  case "spotter": await append("settings",{spotterAt:Date.now()}); rebuild(); return render();
  case "unlockvol": await append("settings",{unlockHighVolume:t.checked}); rebuild(); return render();
  case "irr": {
    const j=t.dataset.j;
    sheet(`<h3>${esc(j.replace("_"," "))}</h3>
      <p class="sub">How bad, 0 to 10? Fades by a point a day.</p>
      <div class="chips" style="margin-top:10px">${[0,2,4,6,8,10].map(v=>`<button class="chip" data-act="irrset" data-j="${j}" data-v="${v}" style="flex:1">${v}</button>`).join("")}</div>
      <p class="why" style="margin-top:12px"><b>1–5</b> keeps failure sets off it. <b>6+</b> pulls every exercise that loads it out of your sessions. <b>0</b> clears the flag.</p>
      <p class="mini">Sharp, catching, or still there next morning is worth a clinician rather than a change of exercise.</p>`);
    return;
  }
  case "irrset": await append("irritation",{joint:t.dataset.j, sev:+t.dataset.v, d:todayISO()});
    closeSheet(); rebuild(); return render();
  case "redflag": {
    sheet(`<h3>Any of these right now?</h3><ul class="sub">${RED_FLAGS.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <button class="btn wide danger" data-act="redflag-yes" style="margin-top:12px">Yes — one or more</button>
      <button class="btn wide" data-act="closesheet" style="margin-top:8px">No</button>`);
    return;
  }
  case "redflag-yes": await append("redflag",{active:true}); closeSheet(); rebuild(); return go("session");
  case "unblock": await append("redflag",{active:false}); rebuild(); return render();
  case "closesheet": return closeSheet();
  case "confirm-yes": { const cb=CONFIRM_CB; CONFIRM_CB=null; closeSheet(); return cb&&cb(true); }
  case "confirm-no":  { const cb=CONFIRM_CB; CONFIRM_CB=null; closeSheet(); return cb&&cb(false); }
  }
}

async function ensureStarted(){
  const d=todayISO(), stored=S.plans[d];
  if(stored && stored.status==="started") return;
  const plan=ensurePlan(d);
  const slim=Object.assign({}, plan, {
    slots:(plan.slots||[]).map(sl=>{ const c=Object.assign({}, sl); delete c.loadSet; return c; })});
  await append("planStart",{d, plan:slim});
  S.plans[d]=Object.assign({}, plan, {status:"started"});
}
async function commitSet(exId, load, reps, rir, endpoint, extraReps){
  await ensureStarted();
  const e=LIBX[exId], date=todayISO(), plan=S.plans[date];
  const slot=plan.slots.find(s=>s.ex===exId);
  // inputs to the fatigue-aware expectation, measured not assumed
  let priorHard=0;
  for(const ev of S.events) if(ev.type==="set" && ev.payload.d===date
      && !ev.payload.warmup && !S.voided.has(ev.id)){
    const pe=LIBX[ev.payload.ex]; if(!pe) continue;
    for(const m of Object.keys(e.contributions)) if(pe.contributions[m]) { priorHard += pe.contributions[m]; break; }
  }
  const m = slot?slot.muscle:Object.keys(e.contributions)[0];
  /* ms.lastHard is set to TODAY as soon as any set today is credited, so
     reading it here made every set after the first record hoursSince = 0 —
     a full 1.2-rep phantom fatigue bonus, and a different answer depending on
     whether the page had been reloaded. Recovery means "since the last time I
     trained this before today". */
  let lastHard = null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const sess=S.sessions[i];
    if(sess.date>=date) continue;
    if(sess.sets.some(x=>!x.warmup && LIBX[x.ex] && (LIBX[x.ex].contributions[m]||0)>=1)){ lastHard=sess.date; break; }
  }
  const hoursSince = lastHard ? daysBetween(lastHard,date)*24 : 999;
  const es = exState(exId);
  const outlier = es.load && (load < K.OUTLIER_LO*es.load || load > K.OUTLIER_HI*es.load);
  // SAF-OUTLIER: a load outside 0.5-1.5x the trailing distribution needs a
  // confirm tap before it can propagate into the next plan.
  if(outlier){
    const okGo = await confirmSheet("That's a big jump",
      `${fmtL(e,load)} is a long way from your usual ${fmtL(e,es.load)}. Log it anyway?`, "Yes, log it");
    if(!okGo) return;
  }
  await append("set",{ d:date, ex:exId, load, reps, rir,
    endpoint: endpoint || (rir===0?"FAILED_CONCENTRIC":null),
    pReps: slot?slot.reps:reps, pLoad: slot?slot.load:load, pRir: slot?slot.rir:null,
    priorHard: r1(priorHard), hoursSince: Math.round(hoursSince),
    pos: slot?slot.pos:1, warmup:false, rom:1, assisted:0,
    calibration: !!(slot&&slot.calibration), extraReps: extraReps==null?null:extraReps });
  await canaryWrite(S.events.length);
  // Weekly volume, per-exercise counts and the coach card all read derived
  // state; without this the Progress tab reported zero all session.
  rebuild();
}

async function doExport(){
  const payload={ app:"overload", version:1, exported:new Date().toISOString(),
    events:S.events, note:"One JSON object per event. The log is plaintext on purpose." };
  const txt=JSON.stringify(payload);
  const file=new File([txt], `overload-${todayISO()}.txt`, {type:"text/plain"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Overload backup"}); return; }catch(e){}
  }
  const url=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
  const a=document.createElement("a"); a.href=url; a.download=`overload-${todayISO()}.txt`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

window.addEventListener("unhandledrejection", e=>{ try{ toast("Error: "+(e.reason&&e.reason.message||e.reason), "bad"); }catch(_){} });

/* ============================== BOOT =============================== */
(async function boot(){
  try{
    S.events = await allEvents();
    await Sync.init();
    rebuild();
    // First run: stamp the dates that must be fixed once and never recomputed.
    // rampUntil especially — recomputing it daily would mean the ramp never ends.
    if(!S.events.some(e=>e.type==="settings")){
      await append("settings", { startDate: todayISO(),
        rampUntil: addDays(todayISO(), K.RAMP_DAYS) });
      rebuild();
    }
    const c = await canaryCheck();
    if(c.evicted){
      $("#boot").classList.add("hide");
      document.querySelector("main").insertAdjacentHTML("afterbegin",
        `<div class="banner bad">This device had ${c.had} entries and now has none — the browser cleared the app's storage. Don't log anything yet: go to <b>Progress → Backup → Restore from GitHub</b> first.</div>`);
    }
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    // idempotent rollover: '!=' not '>', because westward travel and clock
    // corrections move the local date BACKWARDS and '>' strands you on yesterday.
    const last = await kvGet("last_rollover");
    if(last !== todayISO()){ ensurePlan(todayISO()); await kvPut("last_rollover", todayISO()); }
    render();
    setInterval(()=>{ if(Sync.pending.length) Sync.flush(); }, 120000);
    /* Left open across midnight, the app kept yesterday's plan and offered a
       lift it had already trained as "first time on this one". '!=' not '>':
       westward travel and clock corrections move the local date backwards. */
    setInterval(async ()=>{
      const now = todayISO();
      if(now !== (await kvGet("last_rollover"))){
        await kvPut("last_rollover", now);
        rebuild(); OPEN_EX=null; Rest.clear(); ensurePlan(now); render();
      }
    }, 60000);
  }catch(e){
    $("#boot").textContent = "Failed to start: "+(e.message||e);
    console.error(e);
  }
})();
</script>
