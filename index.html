<script>
"use strict";
/* ===================================================================
   OVERLOAD — an autoregulated hypertrophy coach.
   Objective: aesthetics. Deterministic planner. Single file, zero deps.

   SEC: no external subresource of any kind. This page holds a GitHub
   token with write access to a private repo; a CDN script would run with
   full same-origin authority over it. CSP connect-src is pinned to
   api.github.com so script execution alone cannot exfiltrate.

   Every threshold below carries its provenance. Where the number is an
   engineering guess rather than a literature value it says so, and the
   in-app audit view surfaces that label. Rules are cited by ID in the
   diff log; a plan change that cannot emit a sentence is a thrown error.
   =================================================================== */

if (self !== top) { top.location = self.location; }
const BUILD = "2026-09-10 20:51";  // frame-buster: CSP meta cannot set frame-ancestors

/* ============================ CONSTANTS ============================ */
const K = {
  /* --- progression (PRG-*) --- */
  DEADBAND: 1.0,            // PRG-01 ±1 rep. Derived: Halperin between-participant SD 1.45 reps.
  KAPPA: 0.35,              // reps lost per prior hard set on same group this session. Prior; frozen until n>=40.
  PSI: 1.2,                 // reps lost at zero recovery, tau 24h. Prior; frozen until n>=40.
  FATIGUE_FIT_N: 40,
  UP_STEPS: [[2,0.020],[3,0.035],[1e9,0.050]],     // PRG-02 delta -> +pct
  DOWN_STEPS: [[-2,-0.05],[-3,-0.07],[-1e9,-0.10]],// PRG-03 delta -> -pct
  CAP_REL: { lb_compound:0.10, ub_compound:0.05, isolation:0.05 }, // PRG-08 ACSM 2009 "2-10%" — committee consensus, no trial. HEURISTIC.
  CAP_ABS_LOWER: 5.0, CAP_ABS_UPPER: 2.5,
  COLDSTART_SESSIONS: 3, COLDSTART_CAP_REL: 0.10,  // 8.3
  SEED_MULT: 1.12,          // 8.2 Nuzzo 2024: 15-rep load -> 10-rep load ratio ~1.11-1.14.
  FORCE_JUMP_EXPOSURES: 2,  // PRG-07

  /* --- volume ladder (VOL-*) --- */
  FS_START: 8.0, FS_DEFAULT: 14.0, FS_RAMP_STEP: 2.0,
  FS_UP: 1.0, FS_SOFT_CEIL: 20.0, FS_HARD_CEIL: 26.0,
  QUALIFY_LOAD_FRAC: 0.85,  // VOL-01 a set counts iff load >= 0.85*working AND reps >= band_lo
  SIGMA_FLOOR: 0.8,         // VOL-03 rep-count test-retest SEM 0.7-1.1
  ROLL3_UP: 1.5,            // VOL-06 mean z >= 0.5 of user's own noise
  ROLL3_DELOAD: -3.0,       // VOL-05 mean z <= -1.0
  CUT_DELOAD_MULT: 1.5,     // PHA-03 -> -4.5 during a cut
  SHORTFALL_HOLD: 0.85,     // VOL-07 you cannot bank volume you did not do
  FLAT_WEEKS_PROBE: 8, PROBE_DROP: 2.0, PROBE_WEEKS: 4, PROBE_MIN_TARGET: 12.0, // VOL-09
  DELOAD_SET_MULT: 0.50, DELOAD_DAYS: 7, DELOAD_RIR: 3, // VOL-10 load HELD, not cut

  /* --- selection (SEL-*) --- */
  MAX_SLOTS: 7,             // exercises per session. Matches the spec's own day-1 program
                            // shape (A/B/C, 6-7 slots). Without it, a week joined
                            // on a Thursday crams 15 muscles into two days and the
                            // clock is the only brake — which is not a plan, it's a list.
  MAX_MUSCLES_PER_DAY: 5,
  SESSION_CAP: 9.0,         // SEL-01 ENGINEERING DEFAULT. Verified absent from peer-reviewed literature; the "11" figure is preprint-only.
  SPACING_H: 48,            // SEL-03 constant, not a fitted decay
  ROTATION_BLOCK_WEEKS: 8,  // SEL-04 Baz-Valle 2019: variety costs nothing, helps motivation

  /* --- effort (FAI-*) --- */
  RIR_COMPOUND: 2, RIR_ISOLATION: 1,   // FAI-01 ACSM 2026 "2-3 RIR"; Refalo 2024 thickness identical to failure
  REST_COMPOUND: 120, REST_ISOLATION: 90, // FAI-02 Singer 2024: no difference >90s
  FAILURE_SHARE: 0.25,      // FAI-04 weekly failure sets < 0.25 * weekly target
  RIR_ASK_MAX_REPS: 15,     // 5.3 Halperin set-length moderator: beta .06 (<=12) vs .47 (>12)
  RIR_IGNORE_REPS: 20,

  /* --- safety (SAF-*) --- */
  RAMP_DAYS: 21, RAMP_MIN_RIR: 3, RAMP_MAX_SETS: 2, RAMP_WEEKLY_CAP: 10.0, RAMP_FIRST_FAILURE_SESSION: 7,
  LAYOFF_SHORT: 14, LAYOFF_LONG: 28,   // MIS-01 GUESS. No trial has tested a 14-day layoff in trained lifters.
  OUTLIER_LO: 0.5, OUTLIER_HI: 1.5,    // SAF-OUTLIER
  SCREEN_REASK_DAYS: 180,
  RESTRICTED_SESSIONS: 6, RESTRICTED_WEEKS: 3, // language rules: behavioural tripwire

  /* --- phase (PHA-*) --- */
  BW_ALPHA: 0.10, BW_WINDOW_D: 21, BW_MIN_READINGS: 8,
  GAIN_BAND: [0.0006, 0.0012],   // +0.06..0.12 %BW/wk
  CUT_BAND: [-0.010, -0.005],    // -0.5..-1.0 %BW/wk

  /* --- allocation (VOL-13..15) --- */
  BUDGET: { CUT:60, MAINTAIN:75, GAIN:90 },   // VOL-13 total fractional sets/week by phase.
                            // Key names must match the phase enum exactly — a mismatched key
                            // falls through to MAINTAIN and silently underfeeds a growth block.
  MIN_SETS: 4.0,            // VOL-14 weekly fractional floor per group, direct + indirect.
                            // Judgment (structural balance), not a derived number.
  MAX_TIER_RATIO: 4.0,      // VOL-15 reject any weight edit steeper than 4:1
  OBLIQUE_MAX_DIRECT: 3,    // SEL-05 anti-rotation / anti-lateral-flexion only

  /* --- phase clamps (PHA-*) --- */
  CUT_RATE: [-0.008,-0.005],   // PHA-03 Garthe 2011: 0.7%/wk gave LBM +2.1% vs -0.2% at 1.4%/wk
  GROW_RATE: [0.0020,0.0035],  // PHA-07 judgment; no primary verified
  MAX_CUT_WEEKS: 12,           // PHA-06 then a forced 2-week maintain, enforced not suggested
  PROTEIN_G_PER_KG: 2.2,       // PHA-05 Longland 2016: 2.4 g/kg gave +1.2 kg LM vs +0.1 at 1.2
  WAIST_TRIPWIRE_CM: 2.5,      // PHA-08 calibrated to instrument noise, NOT to a preference study
  WAIST_MDC_CM: 1.7,           // MDC95 for a mean of three. Nothing finer may ever be displayed.
  REVIEW_DAYS: 84,             // UI-01 12 weeks. Eight weeks of direct shoulder work buys about a
                               // millimetre of thickness against 1.7 cm of tape noise.

  /* --- objective --- */
  G_COEF: 1.68,             // g(V)=1.68*sqrt(V) percent hypertrophy over a block
  CALIB_DAYS: 21,           // PRG-10
  RIR_BIAS_INIT: 1.0, RIR_BIAS_LR: 0.3, // PRG-09
};

/* ============ THE OBJECTIVE: attractiveness, not bodybuilding ==========
   FOUR TIERS, NOT SIXTEEN NUMBERS, capped at 4:1 top-to-bottom.

   Why so blunt: exactly one study has ever asked women about individual
   muscle groups (Durkee 2019, n=503). Thirteen of its fourteen muscles fall
   inside a 1.00-point band on a 7-point scale while individual raters
   disagreed by 1.17-1.54 SD — rater heterogeneity exceeds the entire
   between-muscle range. Shrinking toward uniform is the correct response to
   that much noise; a finely-ranked vector fits one small study's sampling error.

   And the item everyone misreads: Durkee asks "How do you find the [MUSCLE]
   most attractive?", anchored 1 = not muscled to 7 = highly muscled. That is
   an IDEAL POINT — the preferred LEVEL of development — not how much the
   muscle contributes to attractiveness. Ranking muscles by it is a category
   error. Only two statements survive: traps is the single group below the
   scale's middle (3.04, and 0.84 clear of the next lowest), and the other
   thirteen are not distinguishable from each other.

   NO MUSCULARITY CEILING SHIPS. Sell 2017 tested quadratic strength terms and
   found no significant one in any sample. Ridley 2022 states outright that it
   could not resolve what happens above 75 kg of skeletal muscle. Aich 2026 —
   the best-powered test that exists — fits a vertex near 2.6 SD, outside its
   own +/-2 SD stimulus range and outside almost all human variation.
   Curvature is real; nobody has located the peak. So the concavity lives on
   the volume->outcome mapping, g(V)=1.68*sqrt(V), and never on a stop.
   ===================================================================== */
const TIER_A = 3.0, TIER_B = 2.0, TIER_C = 1.25, TIER_D = 0.75;
const W_MALE = {
  // Tier A — the upper-torso block. The one verified linear gradient here is
  // block-level and does NOT decompose per muscle, so these are equal rather
  // than falsely ranked against each other.
  lats:TIER_A, delts_side:TIER_A, chest:TIER_A,
  // Tier B — the undifferentiated band. Nothing separates these.
  mid_back:TIER_B, delts_rear:TIER_B, biceps:TIER_B, triceps:TIER_B,
  forearms:TIER_B, abs:TIER_B, glutes:TIER_B,
  // Tier C — recovery-cost rationing against a 4-day budget, NOT a preference
  // call: female raters showed no upper-vs-lower-body difference (p = .361).
  quads:TIER_C, hamstrings:TIER_C, calves:TIER_C, obliques:TIER_C,
  // Tier D — traps is the one genuine per-muscle signal in the literature, and
  // nearly inert in practice: rows, carries and pressing pay both indirectly.
  traps:TIER_D, delts_front:TIER_D,
};
const W_SUM = Object.values(W_MALE).reduce((a,b)=>a+b,0);   // 29.5
const MUSCLES = Object.keys(W_MALE);
const TIER_OF = m => W_MALE[m]===TIER_A?"A":W_MALE[m]===TIER_B?"B":W_MALE[m]===TIER_C?"C":"D";
/* SEL-04: no DIRECT allocation. Both clear the weekly floor on indirect credit
   from rows, deadlifts, carries and overhead pressing. */
const NO_DIRECT = new Set(["traps","delts_front"]);
const MUSCLE_LABEL = { lats:"Lats", delts_side:"Side delts", chest:"Chest", triceps:"Triceps",
  quads:"Quads", glutes:"Glutes", biceps:"Biceps", hamstrings:"Hamstrings", mid_back:"Mid back",
  delts_rear:"Rear delts", calves:"Calves", abs:"Abs", forearms:"Forearms", traps:"Traps",
  delts_front:"Front delts", obliques:"Obliques" };
const JOINTS = ["shoulder","lumbopelvic","knee","elbow","wrist_hand","hip"];

const RED_FLAGS = [
  "Chest pain, pressure, or jaw/arm pain on exertion",
  "Fainting or nearly fainting",
  "Unusual breathlessness at low effort",
  "New or spreading numbness, tingling, or weakness in a limb",
  "Numbness in the saddle area, or new bladder/bowel trouble",
  "Unexplained weight loss, or night pain that wakes you",
  "Fever with back pain",
  "Swelling in one calf",
  "A sudden pop followed by loss of function, or a limb you cannot straighten",
  "Dark or cola-coloured urine after training",
];
const BLOCKED_STRING = "Stop training and contact a clinician about this before you train again. This app cannot assess symptoms and will not generate a plan until you confirm a clinician has cleared you.";
const PED_STRING = "This app does not cover anabolic steroids, SARMs, peptides, or similar compounds — no dosing, cycles, sourcing, or bloodwork. Please speak with a clinician.";

/* ======================= EXERCISE LIBRARY =========================
   Metadata, not code. contributions are FRACTIONAL sets: 1.0 prime
   mover, 0.5 meaningful synergist, 0.0 stabiliser (Pelland 2026 model
   selection). fail_safe=false means a failed rep can pin or drop load
   on trunk/neck/head -> never prescribed at RIR<=1 without a spotter
   flag set fresh this session (SAF-PIN).
   non_working_joint: HARD constraint, three muscles only (SEL-05).
   Verified (Maeo 2023, PMID 38156065): standing vs seated calf raise
   gave whole triceps surae +5.6% vs +2.1%, lateral gastroc +12.4% vs
   +1.7%. Largest exercise-selection effect available, and it is free.
   ================================================================== */

/* =================== LOADABLE SET (the load picker) ===============
   The single highest-value structure in the app. The most-repeated
   complaint about every adaptive lifting app is prescribing a weight
   the gym cannot physically make. That is not an algorithm failure,
   it is a missing data structure. Everything here is in KG canonically;
   pounds are a display conversion only.
   ================================================================== */
const LB = 0.45359237;
const toKg = (v,u)=> u==="lb" ? v*LB : v;
const fromKg = (v,u)=> u==="lb" ? v/LB : v;

function subsetSums(plates, maxKg){
  // plates: [{w:kg per plate, pairs:n}] -> reachable ADDED totals (both sides)
  let reach = new Set([0]);
  for(const p of plates){
    const step = p.w*2, next = new Set(reach);
    for(let n=1;n<=p.pairs;n++) for(const r of reach){
      const v = r + step*n; if(v<=maxKg) next.add(Math.round(v*1000)/1000);
    }
    reach = next;
  }
  return [...reach].sort((a,b)=>a-b);
}
/* Per-profile ceilings. A single 400 kg cap let a cable stack offer 880 lb,
   which is not a weight that exists and makes the picker unusable. */
const PROFILE_CAP_KG = { barbell:400, plate_machine:500, dumbbell_pair:75,
  cable_stack:110, machine_stack:150, assisted:120, bodyweight:60 };
function loadableSet(e, gym){
  const u = gym.unit, cap = PROFILE_CAP_KG[e.profile] || 200;
  const key = e.profile;
  if(key==="barbell"){
    const bar = toKg(gym.barKg!=null?gym.barKg:fromKg(20,u), "kg");
    const plates = gym.plates.map(p=>({w:toKg(p.w,u), pairs:p.pairs}));
    return subsetSums(plates, cap).map(a=>round3(bar+a));
  }
  if(key==="dumbbell_pair"){
    const out=[]; for(const seg of gym.dbSegments){
      const lo=toKg(seg.lo,u), hi=toKg(seg.hi,u), st=toKg(seg.step,u);
      if(!(st>0) || !(hi>=lo)) continue;                 // a 0 step would spin forever
      for(let w=lo; w<=hi+1e-6; w+=st) out.push(round3(w));
    }
    return [...new Set(out)].sort((a,b)=>a-b);   // PER HAND
  }
  if(key==="cable_stack"||key==="machine_stack"||key==="assisted"){
    const st=toKg(gym.stackStep,u); if(!(st>0)) return [0];
    const n=Math.floor(cap/st), out=[];
    for(let i=1;i<=n;i++) out.push(round3(st*i));
    if(gym.microplates) { const m=toKg(gym.microKg,u); const ext=[]; for(const v of out){ext.push(round3(v+m));} return [...new Set(out.concat(ext))].sort((a,b)=>a-b); }
    return out;
  }
  if(key==="plate_machine"){
    const plates = gym.plates.map(p=>({w:toKg(p.w,u), pairs:p.pairs}));
    return subsetSums(plates, cap);
  }
  if(key==="bodyweight"){
    const st=toKg(gym.stackStep,u); if(!(st>0)) return [0];
    const out=[0]; for(let i=1;i<=Math.floor(cap/st);i++) out.push(round3(st*i));
    return out;
  }
  return [0];
}
const round3=v=>Math.round(v*1000)/1000;
/* Comparison tolerance in kg. No gym on earth has an increment finer than
   0.5 kg, so 5 g is far below any real step and far above float noise from
   the lb<->kg conversion. Using 1e-6 here silently produced "30 lb -> 30 lb"
   progressions: a set member rounded to 13.608 reads as heavier than an
   unsnapped 13.6077711, and every downstream decision inherits the lie. */
const LOAD_EPS = 0.005;
function nextLoad(set, cur){ for(const v of set) if(v>cur+LOAD_EPS) return v; return null; }
function prevLoad(set, cur){ let p=null; for(const v of set){ if(v<cur-LOAD_EPS) p=v; else break; } return p; }
/* Every load that enters exercise_state must be a MEMBER of the loadable
   set. Anything else is a weight the gym cannot make. */
function snapLoad(e, kg){ if(kg==null) return null; return nearestLoad(loadableSet(e, S.settings.gym), kg); }
function nearestLoad(set, want){
  if(!set.length) return want;
  let best=set[0], bd=Math.abs(set[0]-want);
  for(const v of set){ const d=Math.abs(v-want); if(d<bd){bd=d;best=v;} }
  return best;
}
/* On an assisted machine the number IS counterweight: more of it makes the
   lift EASIER. Progressing such a lift means going DOWN the stack. Treating it
   like every other machine ran the progression backwards — beating the target
   added assistance. */
function inverted(e){ return !!e && e.profile==="assisted"; }
function harderLoad(e, set, cur){ return inverted(e) ? prevLoad(set,cur) : nextLoad(set,cur); }
/* Apply a percentage step and land on a load the gym can actually make,
   without ever OVERSHOOTING what was asked for. Picking the value nearest the
   requested percentage could jump past it — so a +2% request landed on a +9%
   rung, the cap then rejected it, and the sentence named a weight that was
   never going to be used. Take the largest legal step that does not exceed the
   request; if none exists, take the smallest legal step and let the caller's
   cap decide. Returns null when the rack has nothing in that direction. */
function applyLoadStep(set, cur, pct, e){
  const harder = pct>0;
  const dir = inverted(e) ? -1 : 1;
  const want = cur*(1 + pct*dir);
  const cand = (harder === (dir>0)) ? set.filter(v=>v>cur+LOAD_EPS) : set.filter(v=>v<cur-LOAD_EPS);
  if(!cand.length) return null;
  const within = dir>0 ? cand.filter(v=>v<=want+LOAD_EPS) : cand.filter(v=>v>=want-LOAD_EPS);
  if(within.length) return dir>0 ? Math.max(...within) : Math.min(...within);
  return dir>0 ? Math.min(...cand) : Math.max(...cand);
}
